apiVersion: v1
kind: List
items:
  # Three ordinary, failure-isolated Jobs (not an Indexed Job). All stochastic
  # streams are keyed identically; ARM changes only the frozen cache assignment.
  - &coupling_smoke
    apiVersion: batch/v1
    kind: Job
    metadata: {name: as-jet-coupling-exact-smoke-r2}
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          volumes: &volumes
            - name: data
              persistentVolumeClaim: {claimName: as-jet-train-pvc-2}
          containers:
            - name: train
              image: python:3.10-slim
              env:
                - {name: ARM, value: exact}
                - name: POD_UID
                  valueFrom: {fieldRef: {fieldPath: metadata.uid}}
              command: &command
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  GIT_COMMIT="8a70f811c13c4febe6a5223c15b851919939c9bf"
                  test "$GIT_COMMIT" != "REPLACE_WITH_PUSHED_COMMIT_SHA"
                  case "$ARM" in
                    exact) CONFIG=g30-coupling-exact.yaml; CACHE=cache-coupling-g30-exact.yaml;;
                    canonical) CONFIG=g30-coupling-canonical.yaml; CACHE=cache-coupling-g30-canonical.yaml;;
                    random) CONFIG=g30-coupling-random.yaml; CACHE=cache-coupling-g30-random.yaml;;
                  esac
                  OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-g30-coupling-$ARM-smoke"
                  CACHE_PATH="$OUT/cache/icp_cache.pkl"
                  mkdir -p "$OUT" /tmp/runtime
                  exec > >(tee "$OUT/run.log") 2>&1
                  printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
                  tar -xf /mnt/data/caches/runtime/python-env-py310-torch271.tar -C /tmp/runtime
                  PYTHON=/tmp/runtime/python-env/bin/python
                  "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
                  mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
                  cd /tmp/repo/src
                  "$PYTHON" prepare_stage1.py --output-path "$OUT" --cache-dir /mnt/data/caches/stage1 --jet-types g --num-particles 30 --model-version v3
                  "$PYTHON" cache_icp.py --config "configs/$CACHE" --set paths.output_path="$OUT" --set paths.icp_cache_path="$CACHE_PATH" --set cache.n_samples=10000 --set cache.n_workers=8
                  "$PYTHON" -m torch.distributed.run --standalone --nproc_per_node=1 train.py --config "configs/$CONFIG" --set paths.output_path="$OUT" --set paths.icp_cache_path="$CACHE_PATH" --set training.n_train_samples=10000 --set training.num_epochs=20 --set training.max_optimizer_steps=500 --set training.lr_warmup_steps=200 --set training.stability_probe_steps="[0,100,500]" --set training.qualification_min_loss_improvement=null --set inference.n_samples=512 --set inference.skip_metrics=true
              volumeMounts: &mounts [{name: data, mountPath: /mnt/data}]
              resources: &resources
                requests: {nvidia.com/a40: 1, cpu: "8", memory: 24Gi}
                limits: {nvidia.com/a40: 1, cpu: "8", memory: 24Gi}
  - <<: *coupling_smoke
    metadata: {name: as-jet-coupling-canonical-smoke-r2}
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          volumes: *volumes
          containers: [{name: train, image: "python:3.10-slim", env: [{name: ARM, value: canonical}, {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}], command: *command, volumeMounts: *mounts, resources: *resources}]
  - <<: *coupling_smoke
    metadata: {name: as-jet-coupling-random-smoke-r2}
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          volumes: *volumes
          containers: [{name: train, image: "python:3.10-slim", env: [{name: ARM, value: random}, {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}], command: *command, volumeMounts: *mounts, resources: *resources}]
