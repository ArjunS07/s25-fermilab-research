apiVersion: v1
kind: List
items:
  # Four ordinary, failure-isolated Jobs. The common keyed RNG contract makes LR the only
  # treatment difference. Physics metrics remain deferred; each arm retains probes/checkpoints.
  - &lr_job
    apiVersion: batch/v1
    kind: Job
    metadata: {name: as-jet-w256-lr-epoch-r1}
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          volumes: &volumes
            - name: data
              persistentVolumeClaim: {claimName: as-jet-train-pvc-2}
          containers:
            - name: train
              image: python:3.10-slim
              env:
                - {name: ARM, value: epoch}
                - name: POD_UID
                  valueFrom: {fieldRef: {fieldPath: metadata.uid}}
              command: &command
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  GIT_COMMIT="fad1a43be1524309356dc2864023abb492be386c"
                  case "$ARM" in
                    epoch) LR=0.0006; STEP_UNIT=epoch;;
                    step) LR=0.0006; STEP_UNIT=optimizer_step;;
                    half) LR=0.0003; STEP_UNIT=optimizer_step;;
                    quarter) LR=0.00015; STEP_UNIT=optimizer_step;;
                  esac
                  LABEL="width256-lr-${ARM}-keyed"
                  OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-g30-$LABEL-smoke"
                  mkdir -p "$OUT" /tmp/runtime
                  exec > >(tee "$OUT/run.log") 2>&1
                  printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
                  tar -xf /mnt/data/caches/runtime/python-env-py310-torch271.tar -C /tmp/runtime
                  PYTHON=/tmp/runtime/python-env/bin/python
                  "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
                  mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
                  cd /tmp/repo/src
                  "$PYTHON" prepare_stage1.py --output-path "$OUT" --cache-dir /mnt/data/caches/stage1 --jet-types g --num-particles 30 --model-version v3
                  "$PYTHON" -m torch.distributed.run --standalone --nproc_per_node=1 train.py \
                    --config configs/g30-mass-shell.yaml \
                    --set paths.output_path="$OUT" \
                    --set model.n_hidden=256 \
                    --set training.lr="$LR" \
                    --set training.lr_step_unit="$STEP_UNIT" \
                    --set training.max_optimizer_steps=2000 \
                    --set training.stability_probe_steps="[0,100,500,1000,2000]" \
                    --set training.qualification_min_loss_improvement=null \
                    --set inference.n_samples=2000 \
                    --set inference.skip_metrics=true
              volumeMounts: &mounts [{name: data, mountPath: /mnt/data}]
              resources: &resources
                requests: {nvidia.com/a40: 1, cpu: "2", memory: 24Gi}
                limits: {nvidia.com/a40: 1, cpu: "2.4", memory: 24Gi}
  - <<: *lr_job
    metadata: {name: as-jet-w256-lr-step-r1}
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          volumes: *volumes
          containers: [{name: train, image: "python:3.10-slim", env: [{name: ARM, value: step}, {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}], command: *command, volumeMounts: *mounts, resources: *resources}]
  - <<: *lr_job
    metadata: {name: as-jet-w256-lr-half-r1}
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          volumes: *volumes
          containers: [{name: train, image: "python:3.10-slim", env: [{name: ARM, value: half}, {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}], command: *command, volumeMounts: *mounts, resources: *resources}]
  - <<: *lr_job
    metadata: {name: as-jet-w256-lr-quarter-r1}
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          volumes: *volumes
          containers: [{name: train, image: "python:3.10-slim", env: [{name: ARM, value: quarter}, {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}], command: *command, volumeMounts: *mounts, resources: *resources}]
