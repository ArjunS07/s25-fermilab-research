# Class-matched two-training-seed evaluation for the no-ICP and latent-readout
# GQT-994K methods. The 12 arms are method x training seed x jet class.
# Keep this Job suspended until both seed-43 training endpoints are verified.
# Re-evaluating seed 42 as well as seed 43 gives both seeds the same repaired
# class-filter metric code, 50k/class canonical replay, and frozen CFG weights.
apiVersion: batch/v1
kind: Job
metadata: {name: as-jet-eval-gqt994k-noicp-latent-two-seeds-a40}
spec:
  suspend: true
  ttlSecondsAfterFinished: 259200
  backoffLimitPerIndex: 2
  maxFailedIndexes: 0
  completions: 12
  parallelism: 3
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rci-nautilus01.msu.montana.edu]
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [NVIDIA-A40]
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: as-jet-train-pvc-2}}
      containers:
        - name: eval
          image: python:3.10-slim
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: OMP_NUM_THREADS, value: "2"}
            - {name: MKL_NUM_THREADS, value: "2"}
            - {name: OPENBLAS_NUM_THREADS, value: "1"}
            - {name: TORCH_NUM_THREADS, value: "2"}
            - {name: TORCH_NUM_INTEROP_THREADS, value: "1"}
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail
              GIT_COMMIT="709c48beeab8a76411b7c74f73c94cdf13bd97d6"
              ENV_ARCHIVE="/mnt/data/caches/runtime/python-env-py310-torch271.tar"
              REPLAY_SOURCE="/mnt/data/output/2026-08-24_02-29-13--a85d5bf6-8808-4dd7-93bf-b831ca34fdf4-paper30-gqt994k-cfg-eval/eval/replay_bundle.pt"
              case "$JOB_COMPLETION_INDEX" in
                0|1|2) METHOD="noicp"; TRAIN_SEED=42; SOURCE_RUN="/mnt/data/output/2026-09-08_15-00-09--543a2039-8600-45df-9577-7912e1b00963-gqt30-h-cfg-noicp-994k" ;;
                3|4|5) METHOD="noicp"; TRAIN_SEED=43; POINTER="/mnt/data/output/run-pointers/gqt30-h-cfg-noicp-994k-seed43.txt"; test -s "$POINTER"; SOURCE_RUN=$(< "$POINTER") ;;
                6|7|8) METHOD="latent"; TRAIN_SEED=42; SOURCE_RUN="/mnt/data/output/2026-09-17_01-11-32--52a045ee-bde1-4bf5-8c80-345e3651a13d-gqt30-h-cfg-icp-latent-994k" ;;
                9|10|11) METHOD="latent"; TRAIN_SEED=43; POINTER="/mnt/data/output/run-pointers/gqt30-h-cfg-icp-latent-994k-seed43.txt"; test -s "$POINTER"; SOURCE_RUN=$(< "$POINTER") ;;
                *) echo "Unexpected completion index: $JOB_COMPLETION_INDEX"; exit 1 ;;
              esac
              case "$((JOB_COMPLETION_INDEX % 3))" in
                0) TAG="g-w000"; JET_TYPE="g"; CLASS_ID=0; GUIDANCE="0.00"; USE_CFG=false ;;
                1) TAG="q-w025"; JET_TYPE="q"; CLASS_ID=1; GUIDANCE="0.25"; USE_CFG=true ;;
                2) TAG="t"; JET_TYPE="t"; CLASS_ID=2; USE_CFG=true
                   if [[ "$METHOD" == "noicp" ]]; then TAG="t-w050"; GUIDANCE="0.50"; else TAG="t-w075"; GUIDANCE="0.75"; fi ;;
              esac
              CHECKPOINT="$SOURCE_RUN/train/models/final_checkpoint.pth"
              for required in "$CHECKPOINT" "$REPLAY_SOURCE" "$ENV_ARCHIVE"; do test -s "$required"; done
              OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-gqt994k-${METHOD}-seed${TRAIN_SEED}-${TAG}-classmatched-eval"
              CLASS_REPLAY="/tmp/replay-${JET_TYPE}.pt"
              mkdir -p "$OUT" /tmp/runtime
              exec > >(tee "$OUT/run.log") 2>&1
              printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
              printf '%s\n' "$SOURCE_RUN" > "$OUT/source_run.txt"
              printf 'method=%s\ntraining_seed=%s\njet_type=%s\nintegration_steps=64\ncfg_guidance_weight=%s\nuse_cfg=%s\nreplay_source=%s\nevaluation_seed=42\n' \
                "$METHOD" "$TRAIN_SEED" "$JET_TYPE" "$GUIDANCE" "$USE_CFG" "$REPLAY_SOURCE" > "$OUT/ablation_controls.txt"
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              for attempt in 1 2 3 4 5; do
                if "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"; then
                  break
                fi
                if [ "$attempt" -eq 5 ]; then exit 1; fi
                sleep $((attempt * 15))
              done
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src
              "$PYTHON" - "$CHECKPOINT" "$TRAIN_SEED" "$METHOD" <<'PY'
              import sys
              import torch

              checkpoint, seed, method = sys.argv[1], int(sys.argv[2]), sys.argv[3]
              state = torch.load(checkpoint, map_location="cpu", weights_only=False)
              config = state["full_config"]
              assert state["global_optimizer_step"] == 994000
              assert config["training"]["model_seed"] == seed
              assert config["training"]["coupling"] == ("none" if method == "noicp" else "online_geodesic_icp")
              assert config["model"]["particle_direction_mode"] == ("physical_logmap" if method == "noicp" else "latent_displacement")
              print("Verified", method, "training seed", seed)
              PY
              "$PYTHON" - "$REPLAY_SOURCE" "$CLASS_ID" "$CLASS_REPLAY" <<'PY'
              import sys
              import torch

              source, class_id, destination = sys.argv[1], int(sys.argv[2]), sys.argv[3]
              bundle = torch.load(source, map_location="cpu", weights_only=False)
              ids = bundle["generated_jet_attrs"][:, :5].argmax(dim=-1)
              selection = torch.nonzero(ids == class_id, as_tuple=False).flatten()
              assert selection.numel() == 50_000, selection.numel()
              for key in ("generated_jet_attrs", "jet_phi", "masks", "internal_prior"):
                  bundle[key] = bundle[key][selection]
              bundle["metadata"] = dict(bundle["metadata"], n_samples=50_000, samples_per_jet_type=50_000)
              torch.save(bundle, destination)
              PY
              "$PYTHON" infer.py \
                --config configs/infer-h.yaml \
                --set data.jet_types="[$JET_TYPE]" \
                --set paths.checkpoint_path="$CHECKPOINT" \
                --set paths.output_path="$SOURCE_RUN" \
                --set paths.out_dir="$OUT/eval" \
                --set paths.replay_bundle_path="$CLASS_REPLAY" \
                --set inference.n_samples=50000 \
                --set inference.samples_per_jet_type=50000 \
                --set inference.batch_size=512 \
                --set inference.integration_steps=64 \
                --set inference.prior_dist=axis_aligned_lognormal \
                --set inference.seed=42 \
                --set inference.use_ema_weights=true \
                --set inference.use_cfg="$USE_CFG" \
                --set inference.cfg_guidance_weight="$GUIDANCE" \
                --set inference.stratify_metrics_by_class=true \
                --set inference.skip_metrics=false
              for artifact in samples.pt prior_samples.pt generation_diagnostics.json metrics.csv summary.json; do
                test -s "$OUT/eval/$artifact"
              done
              "$PYTHON" -c 'import json,sys; jet_type,summary=sys.argv[1:]; d=json.load(open(summary)); m=d["metrics"]; required=[f"fpnd_{jet_type}",f"fpd_{jet_type}",f"w1m_{jet_type}",f"w1p_{jet_type}",f"cov_mmd_{jet_type}"]; assert all(k in m for k in required), (required,m.keys()); print({k:m[k] for k in required})' "$JET_TYPE" "$OUT/eval/summary.json"
              POINTER_DIR="/mnt/data/output/run-pointers/gqt994k-noicp-latent-two-seeds"
              mkdir -p "$POINTER_DIR"
              printf '%s\n' "$OUT" > "$POINTER_DIR/${METHOD}-seed${TRAIN_SEED}-${JET_TYPE}.txt.tmp"
              mv "$POINTER_DIR/${METHOD}-seed${TRAIN_SEED}-${JET_TYPE}.txt.tmp" "$POINTER_DIR/${METHOD}-seed${TRAIN_SEED}-${JET_TYPE}.txt"
          volumeMounts: [{name: data, mountPath: /mnt/data}]
          resources:
            requests: {nvidia.com/a40: 1, cpu: "4", memory: 40Gi}
            limits: {nvidia.com/a40: 1, cpu: "4", memory: 40Gi}
