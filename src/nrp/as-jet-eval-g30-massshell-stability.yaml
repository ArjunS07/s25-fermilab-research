apiVersion: batch/v1
kind: Job
metadata:
  name: as-jet-eval-g30-massshell-stability
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: as-train-pvc
          persistentVolumeClaim:
            claimName: as-jet-train-pvc-2
      containers:
        - name: eval
          image: python:3.10-slim
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              GIT_COMMIT="09e20fce58c304a73e915c1891c3773e685a8d7f"
              SOURCE_RUN="/mnt/data/output/2026-07-20_03-32-40--ef83d0f0-38ef-47d4-b81c-72d6dd1ff162-g30-massshell-m01-fixed"
              CHECKPOINT="$SOURCE_RUN/train/models/final_checkpoint.pth"
              ENV_ARCHIVE=/mnt/data/caches/runtime/python-env-py310-torch271.tar

              test -f "$CHECKPOINT"
              test -f "$ENV_ARCHIVE"
              mkdir -p /tmp/runtime
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              test -x "$PYTHON"
              export MPLCONFIGDIR=/mnt/data/caches/matplotlib
              mkdir -p "$MPLCONFIGDIR"

              "$PYTHON" -c "import torch, jetnet, yaml"
              "$PYTHON" -c "import tarfile, urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src

              UNIQUE_RUN_ID="$(date +%F_%H-%M-%S)--$POD_UID"
              BASE_OUT="/mnt/data/output/${UNIQUE_RUN_ID}-g30-massshell-stability"
              mkdir -p "$BASE_OUT"
              printf '%s\n' "$GIT_COMMIT" > "$BASE_OUT/git_commit.txt"
              printf '%s\n' "$SOURCE_RUN" > "$BASE_OUT/source_run.txt"

              run_eval() {
                LABEL="$1"
                STEPS="$2"
                RAPIDITY="$3"
                EXTRA=()
                if [ "$RAPIDITY" != "none" ]; then
                  EXTRA+=(--set "inference.mass_shell_max_step_rapidity=$RAPIDITY")
                  EXTRA+=(--set "inference.mass_shell_max_substeps=64")
                fi
                "$PYTHON" infer.py \
                  --config configs/infer-g30-massshell-screen.yaml \
                  --set paths.checkpoint_path="$CHECKPOINT" \
                  --set paths.output_path="$SOURCE_RUN" \
                  --set paths.out_dir="$BASE_OUT/$LABEL" \
                  --set inference.n_samples=10000 \
                  --set inference.integration_steps="$STEPS" \
                  "${EXTRA[@]}" \
                  2>&1 | tee -a "$BASE_OUT/logs.txt"
              }

              run_eval euler-64 64 none
              run_eval euler-128 128 none
              run_eval euler-256 256 none
              run_eval adaptive-64-r05 64 0.5

              "$PYTHON" experiments/diagnose_mass_shell_checkpoint.py \
                --run-dir "$SOURCE_RUN" --out "$BASE_OUT/diagnostic-euler-64.json" \
                --n-jets 1024 --steps 64
              "$PYTHON" experiments/diagnose_mass_shell_checkpoint.py \
                --run-dir "$SOURCE_RUN" --out "$BASE_OUT/diagnostic-adaptive-64-r05.json" \
                --n-jets 1024 --steps 64 --max-step-rapidity 0.5 --max-substeps 64

              "$PYTHON" -m analysis.compare_mass_shell_stability --base "$BASE_OUT" \
                2>&1 | tee -a "$BASE_OUT/logs.txt"

              echo "Mass-shell stability evaluation complete: $BASE_OUT"
          volumeMounts:
            - mountPath: /mnt/data
              name: as-train-pvc
          resources:
            limits:
              nvidia.com/a40: 1
              memory: 16Gi
              cpu: "2.4"
            requests:
              nvidia.com/a40: 1
              memory: 16Gi
              cpu: "2"
