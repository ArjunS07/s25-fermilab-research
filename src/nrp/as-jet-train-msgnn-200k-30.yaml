# Publication matrix, size-30 half: 4 type-combos {g, q, t, gqt} x {no-CFG, CFG} = 8 jobs.
# Base recipe: configs/mass-shell-gnn-200k.yaml (arm-a reference, 200k optimizer steps).
# Per-job knobs come from the TYPES/CFG env vars; NP is fixed to 30 in the command block.
# Pin GIT_COMMIT to a post-merge main SHA that contains configs/mass-shell-gnn-200k.yaml.
apiVersion: v1
kind: List
items:
  - &job
    apiVersion: batch/v1
    kind: Job
    metadata: {name: as-jet-train-msgnn-200k-g-30}
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          volumes: &volumes [{name: data, persistentVolumeClaim: {claimName: as-jet-train-pvc-2}}]
          containers:
            - name: train
              image: python:3.10-slim
              env: &env_g_off
                - {name: TYPES, value: g}
                - {name: CFG, value: "off"}
                - name: POD_UID
                  valueFrom: {fieldRef: {fieldPath: metadata.uid}}
              command: &command
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  GIT_COMMIT="REPLACE_WITH_FROZEN_COMMIT_SHA"
                  if [ "$GIT_COMMIT" = "REPLACE_WITH_FROZEN_COMMIT_SHA" ]; then
                    echo "GIT_COMMIT is still the placeholder — refusing to run (frozen-harness gate)."; exit 1
                  fi
                  NP=30
                  case "$TYPES" in
                    gqt) JT="g q t"; JTLIST="[g,q,t]"; TAG=gqt;;
                    *)   JT="$TYPES"; JTLIST="[$TYPES]"; TAG="$TYPES";;
                  esac
                  if [ "$CFG" = on ]; then DROP=0.1; USECFG=true; SUFFIX=-cfg; else DROP=0.0; USECFG=false; SUFFIX=; fi
                  LABEL="msgnn-200k-${TAG}-${NP}${SUFFIX}"
                  OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-$LABEL"
                  mkdir -p "$OUT" /tmp/runtime
                  exec > >(tee "$OUT/run.log") 2>&1
                  printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
                  tar -xf /mnt/data/caches/runtime/python-env-py310-torch271.tar -C /tmp/runtime
                  PYTHON=/tmp/runtime/python-env/bin/python
                  "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
                  mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
                  cd /tmp/repo/src
                  "$PYTHON" prepare_stage1.py --output-path "$OUT" --cache-dir /mnt/data/caches/stage1 --jet-types $JT --num-particles $NP --model-version v3
                  "$PYTHON" -m torch.distributed.run --standalone --nproc_per_node=1 train.py \
                    --config configs/mass-shell-gnn-200k.yaml --set paths.output_path="$OUT" \
                    --set data.jet_types="$JTLIST" --set data.num_particles=$NP \
                    --set training.cfg_null_dropout_rate=$DROP --set inference.use_cfg=$USECFG
              volumeMounts: &mounts [{name: data, mountPath: /mnt/data}]
              resources: &resources
                requests: {nvidia.com/a40: 1, cpu: "2", memory: 24Gi}
                limits: {nvidia.com/a40: 1, cpu: "2.4", memory: 24Gi}
  - <<: *job
    metadata: {name: as-jet-train-msgnn-200k-g-30-cfg}
    spec: {ttlSecondsAfterFinished: 3600, backoffLimit: 0, template: {spec: {restartPolicy: Never, volumes: *volumes, containers: [{name: train, image: "python:3.10-slim", env: [{name: TYPES, value: g}, {name: CFG, value: "on"}, {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}], command: *command, volumeMounts: *mounts, resources: *resources}]}}}
  - <<: *job
    metadata: {name: as-jet-train-msgnn-200k-q-30}
    spec: {ttlSecondsAfterFinished: 3600, backoffLimit: 0, template: {spec: {restartPolicy: Never, volumes: *volumes, containers: [{name: train, image: "python:3.10-slim", env: [{name: TYPES, value: q}, {name: CFG, value: "off"}, {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}], command: *command, volumeMounts: *mounts, resources: *resources}]}}}
  - <<: *job
    metadata: {name: as-jet-train-msgnn-200k-q-30-cfg}
    spec: {ttlSecondsAfterFinished: 3600, backoffLimit: 0, template: {spec: {restartPolicy: Never, volumes: *volumes, containers: [{name: train, image: "python:3.10-slim", env: [{name: TYPES, value: q}, {name: CFG, value: "on"}, {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}], command: *command, volumeMounts: *mounts, resources: *resources}]}}}
  - <<: *job
    metadata: {name: as-jet-train-msgnn-200k-t-30}
    spec: {ttlSecondsAfterFinished: 3600, backoffLimit: 0, template: {spec: {restartPolicy: Never, volumes: *volumes, containers: [{name: train, image: "python:3.10-slim", env: [{name: TYPES, value: t}, {name: CFG, value: "off"}, {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}], command: *command, volumeMounts: *mounts, resources: *resources}]}}}
  - <<: *job
    metadata: {name: as-jet-train-msgnn-200k-t-30-cfg}
    spec: {ttlSecondsAfterFinished: 3600, backoffLimit: 0, template: {spec: {restartPolicy: Never, volumes: *volumes, containers: [{name: train, image: "python:3.10-slim", env: [{name: TYPES, value: t}, {name: CFG, value: "on"}, {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}], command: *command, volumeMounts: *mounts, resources: *resources}]}}}
  - <<: *job
    metadata: {name: as-jet-train-msgnn-200k-gqt-30}
    spec: {ttlSecondsAfterFinished: 3600, backoffLimit: 0, template: {spec: {restartPolicy: Never, volumes: *volumes, containers: [{name: train, image: "python:3.10-slim", env: [{name: TYPES, value: gqt}, {name: CFG, value: "off"}, {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}], command: *command, volumeMounts: *mounts, resources: *resources}]}}}
  - <<: *job
    metadata: {name: as-jet-train-msgnn-200k-gqt-30-cfg}
    spec: {ttlSecondsAfterFinished: 3600, backoffLimit: 0, template: {spec: {restartPolicy: Never, volumes: *volumes, containers: [{name: train, image: "python:3.10-slim", env: [{name: TYPES, value: gqt}, {name: CFG, value: "on"}, {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}], command: *command, volumeMounts: *mounts, resources: *resources}]}}}
