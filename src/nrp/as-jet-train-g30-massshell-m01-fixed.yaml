apiVersion: batch/v1
kind: Job
metadata:
  name: as-jet-train-g30-massshell-m01-fixed
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: as-train-pvc
          persistentVolumeClaim:
            claimName: as-jet-train-pvc-2
      containers:
        - name: train
          image: python:3.10-slim
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: STAGE1_RUN
              value: /mnt/data/output/2026-07-18_06-48-59--93316e26-7140-4210-8dea-a8c9c4f2b35d-g30-massshell-m01
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              GIT_COMMIT="353bf5cdde8dadeb82757cfc7f2f0ba112b6b505"
              if [ "$GIT_COMMIT" = "REPLACE_WITH_FROZEN_COMMIT_SHA" ]; then
                echo "ERROR: corrected mass-shell training SHA is not pinned"
                exit 1
              fi
              test -x /mnt/data/python-env/bin/python
              source /mnt/data/python-env/bin/activate
              python -c "import torch, jetnet, yaml"
              python -c "import tarfile, urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo

              cd /tmp/repo/src
              UNIQUE_RUN_ID="$(date +%F_%H-%M-%S)--$POD_UID"
              OUTPUT_PATH="/mnt/data/output/${UNIQUE_RUN_ID}-g30-massshell-m01-fixed"
              mkdir -p "$OUTPUT_PATH"
              printf '%s\n' "$GIT_COMMIT" > "$OUTPUT_PATH/git_commit.txt"

              python prepare_stage1.py \
                --output-path "$OUTPUT_PATH" \
                --cache-dir /mnt/data/caches/stage1 \
                --jet-types g \
                --num-particles 30 \
                --import-run "$STAGE1_RUN"
              torchrun --standalone --nproc_per_node=1 train.py \
                --config configs/g30-mass-shell-m01.yaml \
                --set paths.output_path="$OUTPUT_PATH" \
                --set training.use_icp=false \
                --set model.use_reference_vectors=false \
                2>&1 | tee -a "$OUTPUT_PATH/logs.txt"
          volumeMounts:
            - mountPath: /mnt/data
              name: as-train-pvc
          resources:
            limits:
              nvidia.com/a40: 1
              memory: 16Gi
              cpu: "2.4"
            requests:
              nvidia.com/a40: 1
              memory: 16Gi
              cpu: "2"
