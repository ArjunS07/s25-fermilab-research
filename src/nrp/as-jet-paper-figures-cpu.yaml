apiVersion: batch/v1
kind: Job
metadata:
  name: as-jet-paper-figures-cpu
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: as-jet-paper-figures-cpu
    spec:
      restartPolicy: Never
      containers:
        - name: paper-figures
          image: python:3.11-slim
          env:
            - name: GIT_COMMIT
              value: 345fd8a
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -eu
              apt-get update
              apt-get install -y --no-install-recommends git
              git clone https://github.com/ArjunS07/s25-fermilab-research.git /tmp/repo
              cd /tmp/repo
              git checkout "$GIT_COMMIT"
              pip install --no-cache-dir numpy==1.26.4
              pip install --no-cache-dir torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
              python src/analysis/extract_paper_distribution_histograms.py
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: results
              mountPath: /mnt/data
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: as-jet-train-pvc-2
