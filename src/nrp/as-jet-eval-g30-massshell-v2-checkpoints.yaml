apiVersion: batch/v1
kind: Job
metadata:
  name: as-jet-eval-g30-massshell-v2-checkpoints
spec:
  completions: 4
  parallelism: 4
  completionMode: Indexed
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: as-jet-train-pvc-2
      containers:
        - name: eval
          image: python:3.10-slim
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              GIT_COMMIT="REPLACE_WITH_FROZEN_COMMIT_SHA"
              SOURCE_RUN="/mnt/data/output/2026-07-23_04-40-41--36429f69-a6a5-49a0-81fd-8f351f5a9c11-g30-massshell-v2"
              AUDIT_RUN="$(ls -dt /mnt/data/output/*-g30-massshell-v2-filtered-analysis | head -n 1)"
              REPLAY="$AUDIT_RUN/analysis/replay_bundle.pt"
              ENV_ARCHIVE=/mnt/data/caches/runtime/python-env-py310-torch271.tar
              case "$JOB_COMPLETION_INDEX" in
                0) STEP=080000; EMA=false ;;
                1) STEP=080000; EMA=true ;;
                2) STEP=100000; EMA=false ;;
                3) STEP=100000; EMA=true ;;
                *) exit 2 ;;
              esac
              VIEW=raw
              test "$EMA" = false || VIEW=ema
              CHECKPOINT="$SOURCE_RUN/train/stability_probes/step_$STEP/checkpoint.pth"
              OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-g30-v2-step-$STEP-$VIEW"

              test "$GIT_COMMIT" != "REPLACE_WITH_FROZEN_COMMIT_SHA"
              test -f "$CHECKPOINT"
              test -f "$REPLAY"
              mkdir -p /tmp/runtime "$OUT"
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              export MPLCONFIGDIR=/mnt/data/caches/matplotlib
              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src
              printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
              "$PYTHON" infer.py \
                --config configs/infer-g30-massshell-v2.yaml \
                --set paths.checkpoint_path="$CHECKPOINT" \
                --set paths.output_path="$SOURCE_RUN" \
                --set paths.out_dir="$OUT/eval" \
                --set paths.replay_bundle_path="$REPLAY" \
                --set inference.use_ema_weights="$EMA" \
                2>&1 | tee "$OUT/run.log"
              test -s "$OUT/eval/metrics.csv"
              test -s "$OUT/eval/generation_diagnostics.json"
          volumeMounts:
            - name: data
              mountPath: /mnt/data
          resources:
            requests:
              nvidia.com/a40: 1
              cpu: "2"
              memory: 24Gi
            limits:
              nvidia.com/a40: 1
              cpu: "2.4"
              memory: 24Gi
