# Throughput-optimized width-64 GQT model.
#
# This is intentionally not a one-knob width ablation: it treats width 64 as its
# own operating point.  Relative to the canonical batch-250/994k-update recipe,
# it preserves total training exposure (248.5M examples) while scaling the batch,
# update count, warmup, EMA horizon, learning rate, and decoupled weight decay.
apiVersion: batch/v1
kind: Job
metadata: {name: as-jet-train-gqt30-h-cfg-w64-opt-248m}
spec:
  ttlSecondsAfterFinished: 259200
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rci-nautilus01.msu.montana.edu]
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: as-jet-train-pvc-2}}
      containers:
        - name: train
          image: python:3.10-slim
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: OMP_NUM_THREADS, value: "2"}
            - {name: MKL_NUM_THREADS, value: "2"}
            - {name: OPENBLAS_NUM_THREADS, value: "1"}
            - {name: TORCH_NUM_THREADS, value: "2"}
            - {name: TORCH_NUM_INTEROP_THREADS, value: "1"}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail
              GIT_COMMIT="0331866592c49a044d22a1481d7cdbeb2453ddeb"
              ENV_ARCHIVE="/mnt/data/caches/runtime/python-env-py310-torch271.tar"
              OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-gqt30-h-cfg-w64-opt-b2048-248m"
              test -s "$ENV_ARCHIVE"
              test "$GIT_COMMIT" != "REPLACE_WITH_FROZEN_COMMIT_SHA"
              mkdir -p "$OUT" /tmp/runtime
              exec > >(tee "$OUT/run.log") 2>&1
              printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
              printf 'treatment=optimized_hidden_width_64\ncomparison_class=optimized_model_not_width_only_ablation\nn_hidden=64\nn_layers=6\nbatch_size=2048\ntarget_batch_size=2048\ntraining_examples=248500224\noptimizer_steps=121338\nlr_scaling=sqrt_batch_ratio\nlr=0.0017173002\nwarmup_steps=244\nema_decay=0.99183740\nweight_decay=0.000002862167\ncfg_null_dropout_rate=0.1\ncoupling=online_geodesic_icp\n' > "$OUT/ablation_controls.txt"
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src
              "$PYTHON" prepare_stage1.py --output-path "$OUT" \
                --cache-dir /mnt/data/caches/stage1 --jet-types g q t \
                --num-particles 30 --model-version v3
              "$PYTHON" train.py \
                --config configs/gqt30-lorentznet-h-rfm-logmap-200k.yaml \
                --set paths.output_path="$OUT" \
                --set model.n_hidden=64 \
                --set model.n_layers=6 \
                --set training.batch_size=2048 \
                --set training.target_batch_size=2048 \
                --set training.num_epochs=300 \
                --set training.max_optimizer_steps=121338 \
                --set training.lr=0.0017173002 \
                --set training.lr_warmup_steps=244 \
                --set training.ema_decay=0.99183740 \
                --set training.weight_decay=0.000002862167 \
                --set training.cfg_null_dropout_rate=0.1 \
                --set training.coupling=online_geodesic_icp \
                --set training.stability_probe_steps="[0,2441,4883,9766,18311,24414,40405,61035,97656,121338]" \
                --set inference.n_samples=150000 \
                --set inference.samples_per_jet_type=50000 \
                --set inference.stratify_metrics_by_class=true \
                --set inference.use_cfg=false \
                --set inference.cfg_guidance_weight=0.0
              for artifact in models/final_checkpoint.pth models/latest_checkpoint.pth metrics.csv summary.json replay_bundle.pt; do
                test -s "$OUT/train/$artifact"
              done
              "$PYTHON" -c 'import json,math,sys,torch; p=sys.argv[1]; c=torch.load(p+"/models/final_checkpoint.pth",map_location="cpu",weights_only=False); s=json.load(open(p+"/summary.json")); f=s["full_config"]; t=f["training"]; assert c["global_optimizer_step"]==121338; assert f["model"]["n_hidden"]==64; assert f["model"]["n_layers"]==6; assert t["batch_size"]==2048; assert t["target_batch_size"]==2048; assert math.isclose(t["lr"],0.0017173002); assert t["lr_warmup_steps"]==244; assert math.isclose(t["ema_decay"],0.99183740); assert t["cfg_null_dropout_rate"]==0.1; assert t["coupling"]=="online_geodesic_icp"; assert sum(v.numel() for v in c["model_state_dict"].values())==276369; assert all(k in s["metrics"] for k in ("fpnd_g","fpnd_q","fpnd_t")); print("Verified optimized width-64 CFG/ICP endpoint")' "$OUT/train"
              mkdir -p /mnt/data/output/run-pointers
              printf '%s\n' "$OUT" > /mnt/data/output/run-pointers/gqt30-h-cfg-w64-optimized-248m.txt.tmp
              mv /mnt/data/output/run-pointers/gqt30-h-cfg-w64-optimized-248m.txt.tmp /mnt/data/output/run-pointers/gqt30-h-cfg-w64-optimized-248m.txt
          volumeMounts: [{name: data, mountPath: /mnt/data}]
          resources:
            requests: {nvidia.com/a40: 1, cpu: "2", memory: 32Gi}
            limits: {nvidia.com/a40: 1, cpu: "2.4", memory: 32Gi}
