apiVersion: batch/v1
kind: Job
metadata:
  name: as-jet-cache-icp-g30-massshell-v2
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: as-jet-train-pvc-2
      containers:
        - name: cache
          image: python:3.10-slim
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              GIT_COMMIT="af2409d525c4262857efd306d22e8632b587cb64"
              test "$GIT_COMMIT" != "REPLACE_WITH_FROZEN_COMMIT_SHA"
              ENV_ARCHIVE=/mnt/data/caches/runtime/python-env-py310-torch271.tar
              mkdir -p /tmp/runtime
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src
              OUT="/mnt/data/output/stage1-g30-v2-cache-build-$HOSTNAME"
              mkdir -p "$OUT"
              STAGE1_BUNDLE=/mnt/data/caches/stage1/g-p30-v1-1780aaeab9d5
              until [ -f "$STAGE1_BUNDLE/stage1_metadata.json" ]; do
                echo "Waiting for smoke job to publish Stage-1 v2 bundle..."
                sleep 30
              done
              "$PYTHON" prepare_stage1.py --output-path "$OUT" \
                --cache-dir /mnt/data/caches/stage1 --jet-types g --num-particles 30 \
                --model-version v2
              "$PYTHON" cache_icp.py --config configs/cache-icp-g30-massshell-v2.yaml \
                --set paths.output_path="$OUT"
          volumeMounts:
            - name: data
              mountPath: /mnt/data
          resources:
            requests:
              cpu: "8"
              memory: 24Gi
            limits:
              cpu: "16"
              memory: 32Gi
