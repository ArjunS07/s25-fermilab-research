# Serial training ablation: raw versus normalized physical tangent references.
# Relative to completed H-994K, this retains online geodesic ICP, physical
# particle log-map directions, and the terminal tangent projection; only the
# reference vectors omit their per-vector tangent-norm normalization.
apiVersion: batch/v1
kind: Job
metadata: {name: as-jet-train-g30-lnet-h-icp-rawrefs-994k}
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rci-nautilus01.msu.montana.edu]
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: as-jet-train-pvc-2}}
      containers:
        - name: train
          image: python:3.10-slim
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: OMP_NUM_THREADS, value: "2"}
            - {name: MKL_NUM_THREADS, value: "2"}
            - {name: OPENBLAS_NUM_THREADS, value: "1"}
            - {name: TORCH_NUM_THREADS, value: "2"}
            - {name: TORCH_NUM_INTEROP_THREADS, value: "1"}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail
              GIT_COMMIT="40dafa2ee953787090370f24c19fa8635aa260ca"
              ENV_ARCHIVE="/mnt/data/caches/runtime/python-env-py310-torch271.tar"
              OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-g30-lnet-h-icp-rawrefs-994k"
              test "$GIT_COMMIT" != "REPLACE_WITH_FROZEN_COMMIT_SHA"
              test -s "$ENV_ARCHIVE"
              mkdir -p "$OUT" /tmp/runtime
              exec > >(tee "$OUT/run.log") 2>&1
              printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src
              "$PYTHON" prepare_stage1.py --output-path "$OUT" \
                --cache-dir /mnt/data/caches/stage1 --jet-types g \
                --num-particles 30 --model-version v3
              "$PYTHON" train.py \
                --config configs/g30-lorentznet-h-rfm-logmap-tangentrefs-994k.yaml \
                --set paths.output_path="$OUT" \
                --set model.reference_direction_mode=raw_tangent
              for artifact in models/final_checkpoint.pth models/latest_checkpoint.pth metrics.csv summary.json; do
                test -s "$OUT/train/$artifact"
              done
              "$PYTHON" -c 'import json,sys,torch; p=sys.argv[1]; c=torch.load(p+"/models/final_checkpoint.pth",map_location="cpu",weights_only=False); s=json.load(open(p+"/summary.json")); m=s["full_config"]["model"]; assert c["global_optimizer_step"]==994000; assert s["effective_coupling"]["coupling"]=="online_geodesic_icp"; assert m["particle_direction_mode"]=="physical_logmap"; assert m["reference_direction_mode"]=="raw_tangent"; assert m["final_tangent_projection"] is True; print("Verified ICP raw-reference endpoint and provenance")' "$OUT/train"
          volumeMounts: [{name: data, mountPath: /mnt/data}]
          resources:
            requests: {nvidia.com/a40: 1, cpu: "2", memory: 24Gi}
            limits: {nvidia.com/a40: 1, cpu: "2.4", memory: 24Gi}
