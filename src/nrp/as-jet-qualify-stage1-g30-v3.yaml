apiVersion: batch/v1
kind: Job
metadata:
  name: as-jet-qualify-stage1-g30-v3
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: as-jet-train-pvc-2
      containers:
        - name: qualify
          image: python:3.10-slim
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              GIT_COMMIT="69b824b149f68413d307f4e0ee0450a7044fdab2"
              OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-stage1-g30-v3"
              ENV_ARCHIVE=/mnt/data/caches/runtime/python-env-py310-torch271.tar
              test "$GIT_COMMIT" != "REPLACE_WITH_FROZEN_COMMIT_SHA"
              mkdir -p /tmp/runtime "$OUT"
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              "$PYTHON" -c "import normflows,torch"
              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src
              printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
              "$PYTHON" prepare_stage1.py --output-path "$OUT" \
                --cache-dir /mnt/data/caches/stage1 --jet-types g \
                --num-particles 30 --model-version v3 \
                2>&1 | tee "$OUT/train.log"
              "$PYTHON" -m experiments.audit_stage1 \
                --source-run "$OUT" --out-dir "$OUT/audit" \
                --n-samples 500000 2>&1 | tee "$OUT/audit.log"
              test -s "$OUT/stage1_v3_training.json" || test -s \
                "$(cat "$OUT/stage1_source.txt")/stage1_metadata.json"
              test -s "$OUT/audit/stage1_audit.json"
          volumeMounts:
            - name: data
              mountPath: /mnt/data
          resources:
            requests:
              nvidia.com/a40: 1
              cpu: "2"
              memory: 24Gi
            limits:
              nvidia.com/a40: 1
              cpu: "2.4"
              memory: 24Gi
