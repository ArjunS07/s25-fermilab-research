apiVersion: batch/v1
kind: Job
metadata:
  name: as-jet-eval-w256-lr-half-r1
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: as-jet-train-pvc-2
      containers:
        - name: eval
          image: python:3.10-slim
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              GIT_COMMIT="fad1a43be1524309356dc2864023abb492be386c"
              SOURCE_RUN="/mnt/data/output/2026-07-28_22-45-25--fc4a1ff4-7352-4ec5-9627-1b09e879d6a8-g30-width256-lr-half-keyed-smoke"
              CHECKPOINT="$SOURCE_RUN/train/models/final_checkpoint.pth"
              ENV_ARCHIVE=/mnt/data/caches/runtime/python-env-py310-torch271.tar

              test -f "$CHECKPOINT"
              test -f "$ENV_ARCHIVE"
              mkdir -p /tmp/runtime
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              export MPLCONFIGDIR=/mnt/data/caches/matplotlib
              mkdir -p "$MPLCONFIGDIR"

              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src

              RUN_ID="$(date +%F_%H-%M-%S)--$POD_UID-g30-w256-lr-half-r1-eval"
              OUT="/mnt/data/output/$RUN_ID"
              mkdir -p "$OUT"
              printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
              printf '%s\n' "$SOURCE_RUN" > "$OUT/source_run.txt"

              "$PYTHON" infer.py \
                --config configs/infer-g30-mass-shell.yaml \
                --set paths.checkpoint_path="$CHECKPOINT" \
                --set paths.output_path="$SOURCE_RUN" \
                --set paths.out_dir="$OUT/eval" \
                --set inference.n_samples=50000 \
                --set inference.use_ema_weights=true \
                --set inference.skip_metrics=false \
                2>&1 | tee "$OUT/run.log"

              test -s "$OUT/eval/generation_diagnostics.json"
              test -s "$OUT/eval/samples.pt"
              test -s "$OUT/eval/metrics.csv"
              test -s "$OUT/eval/summary.json"
          volumeMounts:
            - name: data
              mountPath: /mnt/data
          resources:
            requests:
              nvidia.com/a40: 1
              cpu: "2"
              memory: 24Gi
            limits:
              nvidia.com/a40: 1
              cpu: "2.4"
              memory: 24Gi
