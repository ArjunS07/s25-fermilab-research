apiVersion: batch/v1
kind: Job
metadata:
  name: as-jet-calibrate-g30-massshell-v2-gram-scratch-5k
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: as-jet-train-pvc-2
      containers:
        - name: calibrate
          image: python:3.10-slim
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              GIT_COMMIT="735fedb10b8d59f69a542b96173af3bdaa430905"
              SOURCE="$(ls -dt /mnt/data/output/*-g30-massshell-v2-scratch-gram50-5k | head -n 1)"
              RESUME="$SOURCE/train/stability_probes/step_005000/checkpoint.pth"
              ENV_ARCHIVE=/mnt/data/caches/runtime/python-env-py310-torch271.tar
              OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-g30-massshell-v2-gram-scratch-cal-5k"
              test -f "$RESUME"
              mkdir -p /tmp/runtime "$OUT"
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src
              printf '%s\n' "$RESUME" > "$OUT/source_checkpoint.txt"
              "$PYTHON" prepare_stage1.py --output-path "$OUT" \
                --cache-dir /mnt/data/caches/stage1 --jet-types g --num-particles 30 \
                --model-version v3
              "$PYTHON" -m torch.distributed.run --standalone --nproc_per_node=1 train.py \
                --config configs/g30-mass-shell-v2-aux-calibration.yaml \
                --set paths.output_path="$OUT" \
                --set paths.resume_weights="$RESUME" 2>&1 | tee "$OUT/run.log"
              test -s "$OUT/train/aux_calibration.json"
          volumeMounts:
            - name: data
              mountPath: /mnt/data
          resources:
            requests:
              nvidia.com/a40: 1
              cpu: "2"
              memory: 24Gi
            limits:
              nvidia.com/a40: 1
              cpu: "2.4"
              memory: 24Gi
