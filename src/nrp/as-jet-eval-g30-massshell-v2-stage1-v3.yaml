apiVersion: batch/v1
kind: Job
metadata:
  name: as-jet-eval-g30-massshell-v2-stage1-v3
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: as-jet-train-pvc-2
      containers:
        - name: eval
          image: python:3.10-slim
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              GIT_COMMIT="acc52cdd6e88ef59e333d36f608d6673f50b0b8c"
              STAGE2="/mnt/data/output/2026-07-23_04-40-41--36429f69-a6a5-49a0-81fd-8f351f5a9c11-g30-massshell-v2"
              STAGE1="$(ls -dt /mnt/data/output/*-stage1-g30-v3 | head -n 1)"
              SHARED="/mnt/data/caches/stage1-v3-eval"
              BUNDLE="$SHARED/g30-v3-50k-seed42-replay.pt"
              ENV_ARCHIVE=/mnt/data/caches/runtime/python-env-py310-torch271.tar
              case "$JOB_COMPLETION_INDEX" in
                0) STEP=080000 ;;
                1) STEP=100000 ;;
                *) exit 2 ;;
              esac
              CHECKPOINT="$STAGE2/train/stability_probes/step_$STEP/checkpoint.pth"
              OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-g30-v2-$STEP-ema-stage1-v3"
              test "$GIT_COMMIT" != "REPLACE_WITH_FROZEN_COMMIT_SHA"
              test -f "$STAGE1/jet_attr_model.pth"
              test -f "$CHECKPOINT"
              mkdir -p /tmp/runtime "$OUT" "$SHARED"
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              export MPLCONFIGDIR=/mnt/data/caches/matplotlib
              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src
              # Atomic one-writer creation; the other indexed pod waits for completion.
              if mkdir "$SHARED/build.lock" 2>/dev/null; then
                "$PYTHON" -m experiments.build_generated_condition_bundle \
                  --stage1-run "$STAGE1" --stage2-run "$STAGE2" \
                  --output "$BUNDLE.tmp"
                mv "$BUNDLE.tmp" "$BUNDLE"
                rmdir "$SHARED/build.lock"
              else
                for _ in $(seq 1 180); do
                  test -s "$BUNDLE" && break
                  sleep 10
                done
              fi
              test -s "$BUNDLE"
              "$PYTHON" infer.py \
                --config configs/infer-g30-massshell-v2.yaml \
                --set paths.checkpoint_path="$CHECKPOINT" \
                --set paths.output_path="$STAGE2" \
                --set paths.out_dir="$OUT/eval" \
                --set paths.replay_bundle_path="$BUNDLE" \
                --set inference.use_ema_weights=true \
                2>&1 | tee "$OUT/run.log"
              test -s "$OUT/eval/metrics.csv"
              test -s "$OUT/eval/generation_diagnostics.json"
          volumeMounts:
            - name: data
              mountPath: /mnt/data
          resources:
            requests:
              nvidia.com/a40: 1
              cpu: "2"
              memory: 24Gi
            limits:
              nvidia.com/a40: 1
              cpu: "2.4"
              memory: 24Gi
