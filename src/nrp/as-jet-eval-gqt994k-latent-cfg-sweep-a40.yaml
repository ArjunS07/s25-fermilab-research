# Full all-class CFG sweep for the matched ICP latent-displacement readout model.
# Training is complete; every arm replays the same canonical GQT bundle.
apiVersion: batch/v1
kind: Job
metadata: {name: as-jet-eval-gqt994k-latent-cfg-sweep-a40}
spec:
  suspend: false
  ttlSecondsAfterFinished: 259200
  backoffLimit: 0
  completions: 7
  parallelism: 7
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rci-nautilus01.msu.montana.edu]
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: as-jet-train-pvc-2}}
      containers:
        - name: eval
          image: python:3.10-slim
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: OMP_NUM_THREADS, value: "2"}
            - {name: MKL_NUM_THREADS, value: "2"}
            - {name: OPENBLAS_NUM_THREADS, value: "1"}
            - {name: TORCH_NUM_THREADS, value: "2"}
            - {name: TORCH_NUM_INTEROP_THREADS, value: "1"}
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail
              GIT_COMMIT="9b4bed282f695561bf94d0f358dc5bacde49a8b7"
              ENV_ARCHIVE="/mnt/data/caches/runtime/python-env-py310-torch271.tar"
              REPLAY="/mnt/data/output/2026-08-24_02-29-13--a85d5bf6-8808-4dd7-93bf-b831ca34fdf4-paper30-gqt994k-cfg-eval/eval/replay_bundle.pt"
              SOURCE_RUN=$(find /mnt/data/output -maxdepth 1 -type d -name "*-gqt30-h-cfg-icp-latent-994k" -print | sort | tail -n 1)
              CHECKPOINT="$SOURCE_RUN/train/models/final_checkpoint.pth"
              case "$JOB_COMPLETION_INDEX" in
                0) TAG="w000"; GUIDANCE="0.00"; USE_CFG=false ;;
                1) TAG="w025"; GUIDANCE="0.25"; USE_CFG=true ;;
                2) TAG="w050"; GUIDANCE="0.50"; USE_CFG=true ;;
                3) TAG="w075"; GUIDANCE="0.75"; USE_CFG=true ;;
                4) TAG="w100"; GUIDANCE="1.00"; USE_CFG=true ;;
                5) TAG="w200"; GUIDANCE="2.00"; USE_CFG=true ;;
                6) TAG="w300"; GUIDANCE="3.00"; USE_CFG=true ;;
                *) echo "Unexpected completion index: $JOB_COMPLETION_INDEX"; exit 1 ;;
              esac
              for required in "$CHECKPOINT" "$REPLAY" "$ENV_ARCHIVE"; do test -s "$required"; done
              OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-gqt994k-latent-cfg-${TAG}-eval"
              mkdir -p "$OUT" /tmp/runtime
              exec > >(tee "$OUT/run.log") 2>&1
              printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
              printf '%s\n' "$SOURCE_RUN" > "$OUT/source_run.txt"
              printf 'readout=latent_displacement\nintegration_steps=64\ncfg_guidance_weight=%s\nuse_cfg=%s\nreplay_bundle=%s\n' "$GUIDANCE" "$USE_CFG" "$REPLAY" > "$OUT/ablation_controls.txt"
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src
              "$PYTHON" -c 'import sys,torch; c=torch.load(sys.argv[1],map_location="cpu",weights_only=False); f=c["full_config"]; assert c["global_optimizer_step"]==994000; assert f["model"]["particle_direction_mode"]=="latent_displacement"; assert f["training"]["coupling"]=="online_geodesic_icp"; print("Verified latent-readout endpoint")' "$CHECKPOINT"
              "$PYTHON" infer.py \
                --config configs/infer-h.yaml \
                --set data.jet_types="[g,q,t]" \
                --set paths.checkpoint_path="$CHECKPOINT" \
                --set paths.output_path="$SOURCE_RUN" \
                --set paths.out_dir="$OUT/eval" \
                --set paths.replay_bundle_path="$REPLAY" \
                --set inference.n_samples=150000 \
                --set inference.samples_per_jet_type=50000 \
                --set inference.batch_size=512 \
                --set inference.integration_steps=64 \
                --set inference.prior_dist=axis_aligned_lognormal \
                --set inference.use_ema_weights=true \
                --set inference.use_cfg="$USE_CFG" \
                --set inference.cfg_guidance_weight="$GUIDANCE" \
                --set inference.stratify_metrics_by_class=true \
                --set inference.skip_metrics=false
              for artifact in samples.pt prior_samples.pt generation_diagnostics.json metrics.csv summary.json; do
                test -s "$OUT/eval/$artifact"
              done
              "$PYTHON" -c 'import json,sys; d=json.load(open(sys.argv[1])); m=d["metrics"]; required=[f"{stem}_{jet}" for stem in ("fpnd","fpd","w1m","w1p","cov_mmd") for jet in ("g","q","t")]; assert all(k in m for k in required), (required,m.keys()); print({k:m[k] for k in required})' "$OUT/eval/summary.json"
          volumeMounts: [{name: data, mountPath: /mnt/data}]
          resources:
            requests: {nvidia.com/a40: 1, cpu: "4", memory: 40Gi}
            limits: {nvidia.com/a40: 1, cpu: "4", memory: 40Gi}
