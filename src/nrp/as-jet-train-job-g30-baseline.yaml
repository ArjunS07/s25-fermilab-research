apiVersion: batch/v1
kind: Job
metadata:
  name: as-jet-train-job-g30-baseline
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: as-train-pvc
          persistentVolumeClaim:
            claimName: as-jet-train-pvc

      containers:
        - name: train
          image: python:3.10-slim
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          command:
            - /bin/bash
            - -c
            - |
              set -e
              set -ex
              apt-get update && apt-get install -y libffi-dev gcc g++ curl git wget build-essential

              mkdir -p /mnt/data
              ls -la /mnt/data

              git clone https://github.com/ArjunS07/s25-fermilab-research /tmp/repo
              cp -r /tmp/repo/src /mnt/data/

              if [ -d "/mnt/data/python-env" ] && /mnt/data/python-env/bin/python -c "import torch; print('Environment OK')" 2>/dev/null; then
                echo "=== Existing environment is working, skipping setup ==="
                source /mnt/data/python-env/bin/activate
              else
                rm -rf /mnt/data/python-env
                python -m venv /mnt/data/python-env
                source /mnt/data/python-env/bin/activate
                pip install torch --index-url https://download.pytorch.org/whl/cu121
                if [ -f /mnt/data/src/requirements.txt ]; then
                  pip install -r /mnt/data/src/requirements.txt
                else
                  echo "No requirements.txt found, skipping pip install"
                fi
              fi

              echo "=== Environment setup complete, starting training ==="
              export CUDA_LAUNCH_BLOCKING=1
              export TORCH_USE_CUDA_DSA=1

              cd /mnt/data/src

              UNIQUE_RUN_ID="$(date +%F_%H-%M-%S)--$POD_UID"
              OUTPUT_PATH="/mnt/data/output/$UNIQUE_RUN_ID-g30-polar-baseline"
              echo "Output path: $OUTPUT_PATH"
              mkdir $OUTPUT_PATH

              python3 data.py --jet_types g --num_particles=30 --output_path=${OUTPUT_PATH}
              python3 jet_attr_model.py --output_path=${OUTPUT_PATH}
              python3 train.py \
                --jet_types g --num_particles=30 \
                --train_space=polar --time_sampling=power_law \
                --batch_size=16 --num_epochs=50 \
                --n_samples=50000 --integration_steps=256 --n_layers=3 \
                --output_path=${OUTPUT_PATH} --use_residual \
                --use_cosine_lr --use_time_sampling --no-use_curriculum \
                | tee -a ${OUTPUT_PATH}/logs.txt
          volumeMounts:
            - mountPath: /mnt/data
              name: as-train-pvc
          resources:
            limits:
              nvidia.com/a40: 1
              memory: "16Gi"
              cpu: "2.4"
            requests:
              nvidia.com/a40: 1
              memory: "16Gi"
              cpu: "2"
