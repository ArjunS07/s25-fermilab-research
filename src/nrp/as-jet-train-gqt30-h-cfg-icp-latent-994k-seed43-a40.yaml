# Independent second training seed for the 994K latent-readout ablation.
# The original seed-42 run used this same pinned training code, optimizer,
# architecture, ICP coupling, data, and terminal evaluation. Only the five
# Stage-2 training RNG streams are shifted by +1; Stage-1 remains fixed.
apiVersion: batch/v1
kind: Job
metadata: {name: as-jet-train-gqt30-h-cfg-icp-latent-994k-seed43-a40}
spec:
  ttlSecondsAfterFinished: 259200
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rci-nautilus01.msu.montana.edu]
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [NVIDIA-A40]
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: as-jet-train-pvc-2}}
      containers:
        - name: train
          image: python:3.10-slim
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: OMP_NUM_THREADS, value: "2"}
            - {name: MKL_NUM_THREADS, value: "2"}
            - {name: OPENBLAS_NUM_THREADS, value: "1"}
            - {name: TORCH_NUM_THREADS, value: "2"}
            - {name: TORCH_NUM_INTEROP_THREADS, value: "1"}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail
              GIT_COMMIT="9b4bed282f695561bf94d0f358dc5bacde49a8b7"
              ENV_ARCHIVE="/mnt/data/caches/runtime/python-env-py310-torch271.tar"
              OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-gqt30-h-cfg-icp-latent-994k-seed43"
              test "$GIT_COMMIT" != "REPLACE_WITH_FROZEN_COMMIT_SHA"
              test -s "$ENV_ARCHIVE"
              mkdir -p "$OUT" /tmp/runtime
              exec > >(tee "$OUT/run.log") 2>&1
              printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
              printf 'treatment=latent_displacement_readout\nseed_replicate=2\nmodel_seed=43\ndata_order_seed=1043\ntime_seed=2043\ndropout_seed=3043\nprior_seed=4043\ncoupling=online_geodesic_icp\ncfg_null_dropout_rate=0.1\noptimizer_steps=994000\n' > "$OUT/ablation_controls.txt"
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src
              "$PYTHON" prepare_stage1.py --output-path "$OUT" \
                --cache-dir /mnt/data/caches/stage1 --jet-types g q t \
                --num-particles 30 --model-version v3
              "$PYTHON" train.py \
                --config configs/gqt30-lorentznet-h-rfm-logmap-200k.yaml \
                --set paths.output_path="$OUT" \
                --set training.num_epochs=2000 \
                --set training.max_optimizer_steps=994000 \
                --set training.model_seed=43 \
                --set training.data_order_seed=1043 \
                --set training.time_seed=2043 \
                --set training.dropout_seed=3043 \
                --set training.prior_seed=4043 \
                --set training.cfg_null_dropout_rate=0.1 \
                --set training.stability_probe_steps="[0,20000,40000,80000,150000,200000,331000,500000,800000,994000]" \
                --set inference.use_cfg=true \
                --set inference.cfg_guidance_weight=1.0 \
                --set model.particle_direction_mode=latent_displacement
              for artifact in models/final_checkpoint.pth models/latest_checkpoint.pth metrics.csv summary.json; do
                test -s "$OUT/train/$artifact"
              done
              "$PYTHON" -c 'import json,sys,torch; p=sys.argv[1]; c=torch.load(p+"/models/final_checkpoint.pth",map_location="cpu",weights_only=False); s=json.load(open(p+"/summary.json")); f=s["full_config"]; t=f["training"]; assert c["global_optimizer_step"]==994000 and s["global_optimizer_step"]==994000; assert f["data"]["jet_types"]==["g","q","t"]; assert (t["model_seed"],t["data_order_seed"],t["time_seed"],t["dropout_seed"],t["prior_seed"])==(43,1043,2043,3043,4043); assert t["cfg_null_dropout_rate"]==0.1 and t["coupling"]=="online_geodesic_icp"; assert f["model"]["particle_direction_mode"]=="latent_displacement"; assert f["model"]["reference_direction_mode"]=="normalized_tangent"; print("Verified seed-43 GQT CFG ICP latent-readout endpoint")' "$OUT/train"
              mkdir -p /mnt/data/output/run-pointers
              printf '%s\n' "$OUT" > /mnt/data/output/run-pointers/gqt30-h-cfg-icp-latent-994k-seed43.txt.tmp
              mv /mnt/data/output/run-pointers/gqt30-h-cfg-icp-latent-994k-seed43.txt.tmp /mnt/data/output/run-pointers/gqt30-h-cfg-icp-latent-994k-seed43.txt
          volumeMounts: [{name: data, mountPath: /mnt/data}]
          resources:
            requests: {nvidia.com/a40: 1, cpu: "2", memory: 24Gi}
            limits: {nvidia.com/a40: 1, cpu: "2.4", memory: 24Gi}
