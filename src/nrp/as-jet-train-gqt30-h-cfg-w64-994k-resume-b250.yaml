# Resume the width-64 capacity ablation with one full effective batch per step.
# The original microbatch=50/accumulation=5 run underfilled its A40 (32.2% over
# three hours).  This keeps effective batch=250 and the optimizer/LR schedule
# unchanged while eliminating accumulation overhead.
apiVersion: batch/v1
kind: Job
metadata: {name: as-jet-train-gqt30-h-cfg-w64-994k-b250}
spec:
  ttlSecondsAfterFinished: 259200
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rci-nautilus01.msu.montana.edu]
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: as-jet-train-pvc-2}}
      containers:
        - name: train
          image: python:3.10-slim
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: OMP_NUM_THREADS, value: "2"}
            - {name: MKL_NUM_THREADS, value: "2"}
            - {name: OPENBLAS_NUM_THREADS, value: "1"}
            - {name: TORCH_NUM_THREADS, value: "2"}
            - {name: TORCH_NUM_INTEROP_THREADS, value: "1"}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail
              GIT_COMMIT="0331866592c49a044d22a1481d7cdbeb2453ddeb"
              ENV_ARCHIVE="/mnt/data/caches/runtime/python-env-py310-torch271.tar"
              OUT="/mnt/data/output/2026-09-17_03-46-36--99d73fa2-897c-484b-9b1b-0f2e75f7349b-gqt30-h-cfg-w64-994k"
              RESUME="$OUT/train/models/latest_checkpoint.pth"
              test -s "$ENV_ARCHIVE"
              test -s "$RESUME"
              test "$GIT_COMMIT" != "REPLACE_WITH_FROZEN_COMMIT_SHA"
              mkdir -p /tmp/runtime
              exec > >(tee -a "$OUT/run.log") 2>&1
              printf '\nresume_reason=nrp_gpu_utilization_policy\nresume_microbatch=250\nresume_target_batch=250\nresume_pod_uid=%s\n' "$POD_UID" >> "$OUT/ablation_controls.txt"
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src
              "$PYTHON" train.py \
                --config configs/gqt30-lorentznet-h-rfm-logmap-200k.yaml \
                --set paths.output_path="$OUT" \
                --set paths.resume_weights="$RESUME" \
                --set model.n_hidden=64 \
                --set model.n_layers=6 \
                --set training.batch_size=250 \
                --set training.target_batch_size=250 \
                --set training.num_epochs=2000 \
                --set training.max_optimizer_steps=994000 \
                --set training.cfg_null_dropout_rate=0.1 \
                --set training.coupling=online_geodesic_icp \
                --set training.stability_probe_steps="[0,20000,40000,80000,150000,200000,331000,500000,800000,994000]" \
                --set inference.n_samples=150000 \
                --set inference.samples_per_jet_type=50000 \
                --set inference.stratify_metrics_by_class=true \
                --set inference.use_cfg=false \
                --set inference.cfg_guidance_weight=0.0
              for artifact in models/final_checkpoint.pth models/latest_checkpoint.pth metrics.csv summary.json replay_bundle.pt; do
                test -s "$OUT/train/$artifact"
              done
              "$PYTHON" -c 'import json,sys,torch; p=sys.argv[1]; c=torch.load(p+"/models/final_checkpoint.pth",map_location="cpu",weights_only=False); s=json.load(open(p+"/summary.json")); f=s["full_config"]; assert c["global_optimizer_step"]==994000; assert f["model"]["n_hidden"]==64; assert f["model"]["n_layers"]==6; assert f["training"]["batch_size"]==250; assert f["training"]["target_batch_size"]==250; assert f["training"]["cfg_null_dropout_rate"]==0.1; assert f["training"]["coupling"]=="online_geodesic_icp"; assert sum(v.numel() for v in c["model_state_dict"].values())==276369; assert all(k in s["metrics"] for k in ("fpnd_g","fpnd_q","fpnd_t")); print("Verified width-64 CFG/ICP endpoint")' "$OUT/train"
              mkdir -p /mnt/data/output/run-pointers
              printf '%s\n' "$OUT" > /mnt/data/output/run-pointers/gqt30-h-cfg-w64-994k.txt.tmp
              mv /mnt/data/output/run-pointers/gqt30-h-cfg-w64-994k.txt.tmp /mnt/data/output/run-pointers/gqt30-h-cfg-w64-994k.txt
          volumeMounts: [{name: data, mountPath: /mnt/data}]
          resources:
            requests: {nvidia.com/a40: 1, cpu: "2", memory: 32Gi}
            limits: {nvidia.com/a40: 1, cpu: "2.4", memory: 32Gi}
