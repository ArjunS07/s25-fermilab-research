apiVersion: batch/v1
kind: Job
metadata:
  name: as-jet-train-g30-massshell-v2-aux-grid
spec:
  completions: 4
  parallelism: 4
  completionMode: Indexed
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: as-jet-train-pvc-2
      containers:
        - name: train
          image: python:3.10-slim
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              GIT_COMMIT="1ae94a36a06b9ba1aca295fc433019f33a455206"
              SOURCE_RUN="/mnt/data/output/2026-07-23_04-40-41--36429f69-a6a5-49a0-81fd-8f351f5a9c11-g30-massshell-v2"
              RESUME="$SOURCE_RUN/train/models/final_checkpoint.pth"
              CALIBRATION_RUN="$(ls -dt /mnt/data/output/*-g30-massshell-v2-aux-calibration | head -n 1)"
              CALIBRATION="$CALIBRATION_RUN/train/aux_calibration.json"
              ENV_ARCHIVE=/mnt/data/caches/runtime/python-env-py310-torch271.tar
              test "$GIT_COMMIT" != "REPLACE_WITH_FROZEN_COMMIT_SHA"
              test -f "$RESUME"
              test -s "$CALIBRATION"
              mkdir -p /tmp/runtime
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              case "$JOB_COMPLETION_INDEX" in
                0) ARM=base; GRAM=0; TOTAL=0 ;;
                1)
                  ARM=total
                  GRAM=0
                  TOTAL="$("$PYTHON" -c 'import json,sys; print(json.load(open(sys.argv[1]))["weights"]["total_momentum_only"])' "$CALIBRATION")"
                  ;;
                2)
                  ARM=gram
                  GRAM="$("$PYTHON" -c 'import json,sys; print(json.load(open(sys.argv[1]))["weights"]["gram_only"])' "$CALIBRATION")"
                  TOTAL=0
                  ;;
                3)
                  ARM=combined
                  GRAM="$("$PYTHON" -c 'import json,sys; print(json.load(open(sys.argv[1]))["weights"]["combined_gram"])' "$CALIBRATION")"
                  TOTAL="$("$PYTHON" -c 'import json,sys; print(json.load(open(sys.argv[1]))["weights"]["combined_total_momentum"])' "$CALIBRATION")"
                  ;;
                *) exit 2 ;;
              esac
              OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-g30-massshell-v2-aux-$ARM"
              mkdir -p "$OUT"
              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src
              printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
              cp "$CALIBRATION" "$OUT/aux_calibration.json"
              printf 'arm=%s\ngram_weight=%s\ntotal_momentum_weight=%s\n' \
                "$ARM" "$GRAM" "$TOTAL" > "$OUT/arm.txt"
              "$PYTHON" prepare_stage1.py --output-path "$OUT" \
                --cache-dir /mnt/data/caches/stage1 --jet-types g --num-particles 30 \
                --model-version v3
              "$PYTHON" -m torch.distributed.run --standalone --nproc_per_node=1 train.py \
                --config configs/g30-mass-shell-v2-aux-continuation.yaml \
                --set paths.output_path="$OUT" \
                --set paths.resume_weights="$RESUME" \
                --set training.aux_gram_weight="$GRAM" \
                --set training.aux_total_momentum_weight="$TOTAL" \
                2>&1 | tee "$OUT/run.log"
              test -s "$OUT/train/models/final_checkpoint.pth"
              test -s "$OUT/train/metrics.csv"
              test -s "$OUT/train/generation_diagnostics.json"
          volumeMounts:
            - name: data
              mountPath: /mnt/data
          resources:
            requests:
              nvidia.com/a40: 1
              cpu: "2"
              memory: 24Gi
            limits:
              nvidia.com/a40: 1
              cpu: "2.4"
              memory: 24Gi
