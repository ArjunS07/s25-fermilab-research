# Launch only after as-jet-train-gqt30-h-cfg-w64-994k writes its completion pointer.
# The terminal training evaluation supplies the common-replay w=0 reference.
apiVersion: batch/v1
kind: Job
metadata: {name: as-jet-eval-gqt30-h-cfg-w64-sweep}
spec:
  ttlSecondsAfterFinished: 259200
  backoffLimit: 0
  completions: 6
  parallelism: 2
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rci-nautilus01.msu.montana.edu]
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: as-jet-train-pvc-2}}
      containers:
        - name: eval
          image: python:3.10-slim
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: OMP_NUM_THREADS, value: "2"}
            - {name: MKL_NUM_THREADS, value: "2"}
            - {name: OPENBLAS_NUM_THREADS, value: "1"}
            - {name: TORCH_NUM_THREADS, value: "2"}
            - {name: TORCH_NUM_INTEROP_THREADS, value: "1"}
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail
              GIT_COMMIT="0331866592c49a044d22a1481d7cdbeb2453ddeb"
              POINTER="/mnt/data/output/run-pointers/gqt30-h-cfg-w64-994k.txt"
              ENV_ARCHIVE="/mnt/data/caches/runtime/python-env-py310-torch271.tar"
              test "$GIT_COMMIT" != "REPLACE_WITH_FROZEN_COMMIT_SHA"
              test -s "$POINTER"
              SOURCE_RUN="$(cat "$POINTER")"
              CHECKPOINT="$SOURCE_RUN/train/models/final_checkpoint.pth"
              REPLAY="$SOURCE_RUN/train/replay_bundle.pt"
              case "$JOB_COMPLETION_INDEX" in
                0) TAG="w0125"; GUIDANCE="0.125" ;;
                1) TAG="w0250"; GUIDANCE="0.250" ;;
                2) TAG="w0375"; GUIDANCE="0.375" ;;
                3) TAG="w0500"; GUIDANCE="0.500" ;;
                4) TAG="w0750"; GUIDANCE="0.750" ;;
                5) TAG="w1000"; GUIDANCE="1.000" ;;
                *) echo "Unexpected completion index: $JOB_COMPLETION_INDEX"; exit 1 ;;
              esac
              for required in "$ENV_ARCHIVE" "$CHECKPOINT" "$REPLAY"; do test -s "$required"; done
              OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-gqt30-h-cfg-w64-${TAG}-eval"
              mkdir -p "$OUT" /tmp/runtime
              exec > >(tee "$OUT/run.log") 2>&1
              printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
              printf '%s\n' "$SOURCE_RUN" > "$OUT/source_run.txt"
              printf 'integration_steps=64\ncfg_guidance_weight=%s\nreplay_bundle=%s\n' "$GUIDANCE" "$REPLAY" > "$OUT/eval_controls.txt"
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src
              "$PYTHON" -c 'import sys,torch; c=torch.load(sys.argv[1],map_location="cpu",weights_only=False); f=c["full_config"]; assert c["global_optimizer_step"]==994000; assert f["model"]["n_hidden"]==64; assert f["model"]["n_layers"]==6; assert f["training"]["cfg_null_dropout_rate"]==0.1; assert f["training"]["coupling"]=="online_geodesic_icp"; print("Verified width-64 CFG/ICP checkpoint")' "$CHECKPOINT"
              "$PYTHON" infer.py \
                --config configs/infer-h.yaml \
                --set data.jet_types="[g,q,t]" \
                --set data.num_particles=30 \
                --set paths.checkpoint_path="$CHECKPOINT" \
                --set paths.output_path="$SOURCE_RUN" \
                --set paths.out_dir="$OUT/eval" \
                --set paths.replay_bundle_path="$REPLAY" \
                --set inference.n_samples=150000 \
                --set inference.samples_per_jet_type=50000 \
                --set inference.batch_size=128 \
                --set inference.integration_steps=64 \
                --set inference.prior_dist=axis_aligned_lognormal \
                --set inference.use_ema_weights=true \
                --set inference.use_cfg=true \
                --set inference.cfg_guidance_weight="$GUIDANCE" \
                --set inference.stratify_metrics_by_class=true \
                --set inference.skip_metrics=false
              for artifact in samples.pt prior_samples.pt generation_diagnostics.json metrics.csv summary.json; do
                test -s "$OUT/eval/$artifact"
              done
              "$PYTHON" -c 'import json,sys; d=json.load(open(sys.argv[1])); m=d["metrics"]; assert d["stage_status"]["samples"]["status"]=="ok"; assert d["stage_status"]["metrics"]["status"]=="ok"; assert all(k in m for k in ("fpnd_g","fpnd_q","fpnd_t")); print({k:m[k] for k in m if k.startswith(("fpnd_","w1m_","fpd_"))})' "$OUT/eval/summary.json"
          volumeMounts: [{name: data, mountPath: /mnt/data}]
          resources:
            requests: {nvidia.com/a40: 1, cpu: "2", memory: 32Gi}
            limits: {nvidia.com/a40: 1, cpu: "2.4", memory: 32Gi}
