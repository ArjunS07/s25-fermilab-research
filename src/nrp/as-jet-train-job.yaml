apiVersion: batch/v1
kind: Job
metadata:
  name: as-jet-train-job
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: as-train-pvc
          persistentVolumeClaim:
            claimName: as-jet-training-pvc

      initContainers:
        - name: setup-env
          image: python:3.10-slim
          volumeMounts:
            - mountPath: /mnt/data/
              name: as-train-pvc
          command:
            - /bin/bash
            - -c
            - |
              set -ex
              apt-get update && apt-get install -y libffi-dev gcc g++ curl git wget build-essential
              
              # Ensure the mount directory exists and is writable
              mkdir -p /mnt/data
              ls -la /mnt/data

              # Check if environment exists and works first
              if [ -d "/mnt/data/python-env" ] && /mnt/data/python-env/bin/python -c "import torch; print('Environment OK')" 2>/dev/null; then
                echo "=== Existing environment is working, skipping setup ==="
              else
                echo "=== Setting up fresh environment ==="
                if [ -d "/mnt/data/python-env" ]; then
                  echo "Moving old environment to background deletion..."
                  mv /mnt/data/python-env /tmp/old-env-$$
                  rm -rf /tmp/old-env-$$ &
                fi
                
                # Create new virtual environment with clean pip
                echo "===Creating new virtual environment"
                python -m venv /mnt/data/python-env
                source /mnt/data/python-env/bin/activate
                
                # Use ensurepip to get a clean pip installation
                echo "=== Installing pip ==="
                python -m ensurepip --upgrade
                python -m pip install --upgrade pip 
                
                # Install PyTorch with CUDA support
                pip install torch --index-url https://download.pytorch.org/whl/cu121

                echo "=== Cloning repository ==="
                # Clone repo and install requirements
                git clone https://github.com/ArjunS07/s25-fermilab-research /tmp/repo
                cp -r /tmp/repo/src /mnt/data/
                
                if [ -f /mnt/data/src/requirements.txt ]; then
                  pip install -r /mnt/data/src/requirements.txt
                else
                  echo "No requirements.txt found, skipping pip install"
                fi
              fi
              
              # Always update source code on each run (even if env was reused)
              echo "=== Updating source code ==="
              rm -rf /tmp/repo
              git clone https://github.com/ArjunS07/s25-fermilab-research /tmp/repo
              cp -r /tmp/repo/src /mnt/data/
              
          resources:
            requests:
              memory: "2000Mi"
              cpu: "1"
            limits:
              memory: "2400Mi"
              cpu: "1.2"

      containers:
        - name: train
          image: python:3.10-slim
          command:
            - /bin/bash
            - -c
            - |
              set -e  # fail on any error

              echo "=== Environment setup complete, starting training ==="
              export CUDA_LAUNCH_BLOCKING=1
              export TORCH_USE_CUDA_DSA=1

              source /mnt/data/python-env/bin/activate
              cd /mnt/data/src
              python3 train.py --batch_size=324 --num_epochs=50 --n_samples=50000 --n_layers=6
          volumeMounts:
            - mountPath: /mnt/data
              name: as-train-pvc
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: "32Gi"
              cpu: "1.2"
            requests:
              nvidia.com/gpu: 1
              memory: "32Gi"
              cpu: "1"