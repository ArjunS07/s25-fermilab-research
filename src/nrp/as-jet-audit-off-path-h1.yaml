apiVersion: batch/v1
kind: Job
metadata:
  name: as-jet-audit-off-path-h1
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: as-jet-train-pvc-2
      containers:
        - name: audit
          image: python:3.10-slim
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              GIT_COMMIT="3a315c83baff4e33a033eebbd211ea4618cd3c54"
              test "$GIT_COMMIT" != "REPLACE_WITH_PUSHED_COMMIT_SHA"
              SOURCE="/mnt/data/output/2026-07-23_04-40-41--36429f69-a6a5-49a0-81fd-8f351f5a9c11-g30-massshell-v2"
              CACHE="/mnt/data/caches/g_p30_v2_massshell_m01_phi-v1-d2/icp_cache.pkl"
              OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-h1-off-path-audit"
              mkdir -p "$OUT" /tmp/runtime
              exec > >(tee "$OUT/run.log") 2>&1
              printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
              test -d "$SOURCE/train/stability_probes"
              test -f "$CACHE"
              tar -xf /mnt/data/caches/runtime/python-env-py310-torch271.tar -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src
              "$PYTHON" experiments/audit_off_path.py \
                --source-run "$SOURCE" \
                --cache-path "$CACHE" \
                --out "$OUT/audit" \
                --n-targets 4096 \
                --fresh-draws 4 \
                --audit-seed 17029 \
                --batch-size 128 \
                --workers 8 \
                --bootstrap-samples 2000
              for artifact in audit_bundle.pt off_path_records.csv.gz \
                off_path_aggregate.csv off_path_summary.json off_path_report.md \
                off_path_gap.png provenance.json; do
                test -s "$OUT/audit/$artifact"
              done
              "$PYTHON" -c "import json; p='$OUT/audit/off_path_summary.json'; s=json.load(open(p)); assert len(s['checkpoints']) == 5; assert s['n_targets_per_split'] == 4096; print('artifact verification passed:', s['verdict'])"
          volumeMounts:
            - name: data
              mountPath: /mnt/data
          resources:
            requests:
              nvidia.com/a40: 1
              cpu: "8"
              memory: 32Gi
            limits:
              nvidia.com/a40: 1
              cpu: "8"
              memory: 32Gi
