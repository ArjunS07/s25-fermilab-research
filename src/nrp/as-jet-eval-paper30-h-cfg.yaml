apiVersion: batch/v1
kind: Job
metadata: {name: as-jet-eval-paper30-h-cfg}
spec:
  ttlSecondsAfterFinished: 259200
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rci-nautilus01.msu.montana.edu]
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: as-jet-train-pvc-2}}
      containers:
        - name: eval
          image: python:3.10-slim
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: OMP_NUM_THREADS, value: "2"}
            - {name: MKL_NUM_THREADS, value: "2"}
            - {name: OPENBLAS_NUM_THREADS, value: "1"}
            - {name: TORCH_NUM_THREADS, value: "2"}
            - {name: TORCH_NUM_INTEROP_THREADS, value: "1"}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail
              GIT_COMMIT="c232473534c2614ddcc2d96ace74481947c28bdf"
              SOURCE_RUN="/mnt/data/output/2026-08-21_10-04-25--cf87d826-9bab-45fb-b52e-02c9a60af5b8-gqt30-lnet-h-cfg-994k"
              CHECKPOINT="$SOURCE_RUN/train/models/final_checkpoint.pth"
              ENV_ARCHIVE="/mnt/data/caches/runtime/python-env-py310-torch271.tar"
              OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-paper30-gqt994k-cfg-eval"
              test -s "$CHECKPOINT"; test -s "$ENV_ARCHIVE"
              mkdir -p "$OUT" /tmp/runtime
              exec > >(tee "$OUT/run.log") 2>&1
              printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
              printf '%s\n' "$SOURCE_RUN" > "$OUT/source_run.txt"
              printf '%s\n' "$CHECKPOINT" > "$OUT/checkpoint.txt"
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src
              "$PYTHON" infer.py --config configs/infer-g30-mass-shell.yaml \
                --set data.jet_types="[g,q,t]" --set paths.checkpoint_path="$CHECKPOINT" \
                --set paths.output_path="$SOURCE_RUN" --set paths.out_dir="$OUT/eval" \
                --set inference.n_samples=150000 --set inference.samples_per_jet_type=50000 \
                --set inference.batch_size=128 --set inference.integration_steps=64 \
                --set inference.prior_dist=axis_aligned_lognormal --set inference.use_ema_weights=true \
                --set inference.use_cfg=true --set inference.cfg_guidance_weight=1.0 \
                --set inference.skip_metrics=false
              test -s "$OUT/eval/summary.json"; test -s "$OUT/eval/metrics.csv"
              "$PYTHON" -c 'import json,sys,torch; b,s=sys.argv[1:]; a=torch.load(b,map_location="cpu",weights_only=False)["generated_jet_attrs"]; ids=a[:,:5].argmax(-1); assert torch.bincount(ids,minlength=5).tolist()[:3]==[50000,50000,50000]; d=json.load(open(s)); assert all(f"fpnd_{x}" in d["metrics"] for x in ("g","q","t")); print({k:d["metrics"][k] for k in d["metrics"] if k.startswith("fpnd_")})' "$OUT/eval/replay_bundle.pt" "$OUT/eval/summary.json"
          volumeMounts: [{name: data, mountPath: /mnt/data}]
          resources:
            requests: {nvidia.com/a40: 1, cpu: "2", memory: 32Gi}
            limits: {nvidia.com/a40: 1, cpu: "2.4", memory: 32Gi}
