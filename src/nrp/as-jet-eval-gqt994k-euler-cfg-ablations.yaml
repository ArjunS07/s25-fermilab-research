# Euler-step ablation for the canonical CFG-trained GQT-994K checkpoint.
# At each integration count, evaluate the three guidance weights needed to
# reproduce every LorentzNet row in the paper table: w=0 supplies the
# no-guidance G/Q/T rows, w=0.25 supplies selected Q, and w=0.5 supplies
# selected T. Each arm reuses its exact 64-step Stage-1/prior replay bundle.
apiVersion: batch/v1
kind: Job
metadata: {name: as-jet-eval-gqt994k-euler-cfg-ablations}
spec:
  ttlSecondsAfterFinished: 259200
  backoffLimit: 0
  completions: 6
  parallelism: 2
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rci-nautilus01.msu.montana.edu]
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: as-jet-train-pvc-2}}
      containers:
        - name: eval
          image: python:3.10-slim
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: OMP_NUM_THREADS, value: "2"}
            - {name: MKL_NUM_THREADS, value: "2"}
            - {name: OPENBLAS_NUM_THREADS, value: "1"}
            - {name: TORCH_NUM_THREADS, value: "2"}
            - {name: TORCH_NUM_INTEROP_THREADS, value: "1"}
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail
              GIT_COMMIT="916ba37fca10bef142f10ced3bd0acc558cfcc94"
              SOURCE_RUN="/mnt/data/output/2026-08-21_10-04-25--cf87d826-9bab-45fb-b52e-02c9a60af5b8-gqt30-lnet-h-cfg-994k"
              CHECKPOINT="$SOURCE_RUN/train/models/final_checkpoint.pth"
              ENV_ARCHIVE="/mnt/data/caches/runtime/python-env-py310-torch271.tar"
              case "$JOB_COMPLETION_INDEX" in
                0) STEPS=32;  TAG="euler32-w000";  GUIDANCE="0.00"; USE_CFG=false ;;
                1) STEPS=32;  TAG="euler32-w025";  GUIDANCE="0.25"; USE_CFG=true  ;;
                2) STEPS=32;  TAG="euler32-w050";  GUIDANCE="0.50"; USE_CFG=true  ;;
                3) STEPS=128; TAG="euler128-w000"; GUIDANCE="0.00"; USE_CFG=false ;;
                4) STEPS=128; TAG="euler128-w025"; GUIDANCE="0.25"; USE_CFG=true  ;;
                5) STEPS=128; TAG="euler128-w050"; GUIDANCE="0.50"; USE_CFG=true  ;;
                *) echo "Unexpected completion index: $JOB_COMPLETION_INDEX"; exit 1 ;;
              esac
              REPLAY="/mnt/data/output/2026-08-24_02-29-13--a85d5bf6-8808-4dd7-93bf-b831ca34fdf4-paper30-gqt994k-cfg-eval/eval/replay_bundle.pt"
              for required in "$CHECKPOINT" "$ENV_ARCHIVE" "$REPLAY"; do test -s "$required"; done
              OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-gqt994k-${TAG}-eval"
              mkdir -p "$OUT" /tmp/runtime
              exec > >(tee "$OUT/run.log") 2>&1
              printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
              printf '%s\n' "$SOURCE_RUN" > "$OUT/source_run.txt"
              printf '%s\n' "$CHECKPOINT" > "$OUT/checkpoint.txt"
              printf 'integration_steps=%s\ncfg_guidance_weight=%s\nuse_cfg=%s\nreplay_bundle=%s\n' "$STEPS" "$GUIDANCE" "$USE_CFG" "$REPLAY" > "$OUT/ablation_controls.txt"
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src
              "$PYTHON" -c 'import sys,torch; c=torch.load(sys.argv[1],map_location="cpu",weights_only=False); assert c["global_optimizer_step"]==994000; print("Verified CFG GQT-994K checkpoint")' "$CHECKPOINT"
              "$PYTHON" infer.py \
                --config configs/infer-h.yaml \
                --set data.jet_types="[g,q,t]" \
                --set paths.checkpoint_path="$CHECKPOINT" \
                --set paths.output_path="$SOURCE_RUN" \
                --set paths.out_dir="$OUT/eval" \
                --set paths.replay_bundle_path="$REPLAY" \
                --set inference.n_samples=150000 \
                --set inference.samples_per_jet_type=50000 \
                --set inference.batch_size=128 \
                --set inference.integration_steps="$STEPS" \
                --set inference.prior_dist=axis_aligned_lognormal \
                --set inference.use_ema_weights=true \
                --set inference.use_cfg="$USE_CFG" \
                --set inference.cfg_guidance_weight="$GUIDANCE" \
                --set inference.stratify_metrics_by_class=true \
                --set inference.skip_metrics=false
              for artifact in samples.pt prior_samples.pt generation_diagnostics.json metrics.csv summary.json; do
                test -s "$OUT/eval/$artifact"
              done
              "$PYTHON" -c 'import json,sys; d=json.load(open(sys.argv[1])); m=d.get("metrics",{}); print({k:m[k] for k in m if k.startswith(("fpnd_","fpd_","w1m_","w1p_","cov_mmd_"))})' "$OUT/eval/summary.json"
          volumeMounts: [{name: data, mountPath: /mnt/data}]
          resources:
            requests: {nvidia.com/a40: 1, cpu: "2", memory: 32Gi}
            limits: {nvidia.com/a40: 1, cpu: "2.4", memory: 32Gi}
