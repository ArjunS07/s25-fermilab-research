apiVersion: batch/v1
kind: Job
metadata:
  name: as-jet-eval-g30-massshell-v2
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: as-jet-train-pvc-2
      containers:
        - name: eval
          image: python:3.10-slim
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              GIT_COMMIT="b9129b8be8d3e9dae29ae3377ada9befed04e933"
              SOURCE_RUN="/mnt/data/output/2026-07-23_04-40-41--36429f69-a6a5-49a0-81fd-8f351f5a9c11-g30-massshell-v2"
              CHECKPOINT="$SOURCE_RUN/train/models/ema_model.pth"
              ENV_ARCHIVE=/mnt/data/caches/runtime/python-env-py310-torch271.tar

              test "$GIT_COMMIT" != "REPLACE_WITH_FROZEN_COMMIT_SHA"
              test -f "$CHECKPOINT"
              test -f "$ENV_ARCHIVE"
              mkdir -p /tmp/runtime
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              test -x "$PYTHON"
              export MPLCONFIGDIR=/mnt/data/caches/matplotlib
              mkdir -p "$MPLCONFIGDIR"

              "$PYTHON" -c "import torch, jetnet, yaml"
              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src

              RUN_ID="$(date +%F_%H-%M-%S)--$POD_UID-g30-massshell-v2-eval"
              OUT="/mnt/data/output/$RUN_ID"
              mkdir -p "$OUT"
              printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
              printf '%s\n' "$SOURCE_RUN" > "$OUT/source_run.txt"
              cp "$SOURCE_RUN/train/generation_diagnostics.json" "$OUT/train_generation_diagnostics.json"

              "$PYTHON" infer.py \
                --config configs/infer-g30-massshell-v2.yaml \
                --set paths.checkpoint_path="$CHECKPOINT" \
                --set paths.output_path="$SOURCE_RUN" \
                --set paths.out_dir="$OUT/eval" \
                2>&1 | tee "$OUT/run.log"

              test -s "$OUT/eval/generation_diagnostics.json"
              test -s "$OUT/eval/samples.pt"
              test -s "$OUT/eval/prior_samples.pt"
              test -s "$OUT/eval/metrics.csv"
              test -s "$OUT/eval/summary.json"
              echo "Full mass-shell v2 evaluation complete: $OUT"
          volumeMounts:
            - name: data
              mountPath: /mnt/data
          resources:
            requests:
              nvidia.com/a40: 1
              cpu: "2"
              memory: 24Gi
            limits:
              nvidia.com/a40: 1
              cpu: "2.4"
              memory: 24Gi
