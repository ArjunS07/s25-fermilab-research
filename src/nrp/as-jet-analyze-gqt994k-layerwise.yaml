# Frozen-checkpoint layerwise depth/width screen. No training.
apiVersion: batch/v1
kind: Job
metadata: {name: as-jet-analyze-gqt994k-layerwise-a100}
spec:
  ttlSecondsAfterFinished: 259200
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rci-nautilus01.msu.montana.edu]
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: as-jet-train-pvc-2}}
      containers:
        - name: analysis
          image: python:3.10-slim
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: OMP_NUM_THREADS, value: "2"}
            - {name: MKL_NUM_THREADS, value: "2"}
            - {name: OPENBLAS_NUM_THREADS, value: "1"}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail
              GIT_COMMIT="0331866592c49a044d22a1481d7cdbeb2453ddeb"
              SOURCE_RUN="/mnt/data/output/2026-08-21_10-04-25--cf87d826-9bab-45fb-b52e-02c9a60af5b8-gqt30-lnet-h-cfg-994k"
              CHECKPOINT="$SOURCE_RUN/train/models/final_checkpoint.pth"
              REPLAY="/mnt/data/output/2026-08-24_02-29-13--a85d5bf6-8808-4dd7-93bf-b831ca34fdf4-paper30-gqt994k-cfg-eval/eval/replay_bundle.pt"
              ENV_ARCHIVE="/mnt/data/caches/runtime/python-env-py310-torch271.tar"
              OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-gqt994k-layerwise-analysis"
              for required in "$CHECKPOINT" "$REPLAY" "$ENV_ARCHIVE"; do test -s "$required"; done
              test "$GIT_COMMIT" != "REPLACE_WITH_FROZEN_COMMIT_SHA"
              mkdir -p "$OUT" /tmp/runtime
              exec > >(tee "$OUT/run.log") 2>&1
              printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
              printf '%s\n' "$SOURCE_RUN" > "$OUT/source_run.txt"
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src
              "$PYTHON" analysis/analyze_layerwise_importance.py \
                --checkpoint "$CHECKPOINT" \
                --replay-bundle "$REPLAY" \
                --output-dir "$OUT/analysis" \
                --max-per-class 512 \
                --batch-size 512 \
                --integration-steps 64 \
                --snapshot-steps 0,8,16,24,32,40,48,56,63 \
                --guidance-weights g=0,q=0.25,t=0.5
              for artifact in layer_residuals.csv field_sensitivity.csv summary.json layerwise_importance.png layerwise_importance.pdf; do
                test -s "$OUT/analysis/$artifact"
              done
              mkdir -p /mnt/data/output/run-pointers
              printf '%s\n' "$OUT" > /mnt/data/output/run-pointers/gqt994k-layerwise-analysis.txt.tmp
              mv /mnt/data/output/run-pointers/gqt994k-layerwise-analysis.txt.tmp /mnt/data/output/run-pointers/gqt994k-layerwise-analysis.txt
          volumeMounts: [{name: data, mountPath: /mnt/data}]
          resources:
            requests: {nvidia.com/a100: 1, cpu: "4", memory: 32Gi}
            limits: {nvidia.com/a100: 1, cpu: "4", memory: 32Gi}
