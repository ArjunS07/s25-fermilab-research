apiVersion: batch/v1
kind: Job
metadata:
  name: as-jet-eval-energy-dist-30-icp-hyperbolic
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: as-train-pvc
          persistentVolumeClaim:
            claimName: as-jet-train-pvc

      containers:
        - name: eval
          image: python:3.10-slim
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          command:
            - /bin/bash
            - -c
            - |
              set -e
              set -ex

              apt-get update && apt-get install -y libffi-dev gcc g++ curl git wget build-essential

              git clone https://github.com/ArjunS07/s25-fermilab-research /tmp/repo
              cp -r /tmp/repo/src /mnt/data/

              if [ -d "/mnt/data/python-env" ] && /mnt/data/python-env/bin/python -c "import torch; print('Environment OK')" 2>/dev/null; then
                echo "=== Existing environment is working, skipping setup ==="
                source /mnt/data/python-env/bin/activate
              else
                rm -rf /mnt/data/python-env
                python -m venv /mnt/data/python-env
                source /mnt/data/python-env/bin/activate
                pip install torch --index-url https://download.pytorch.org/whl/cu121
                if [ -f /mnt/data/src/requirements.txt ]; then
                  pip install -r /mnt/data/src/requirements.txt
                else
                  echo "No requirements.txt found, skipping pip install"
                fi
              fi

              echo "=== Environment setup complete ==="

              cd /mnt/data/src

              TRAIN_OUTPUT_PATH="/mnt/data/output/2026-03-27_10-06-27--bc5696dc-6139-4b66-9916-102fbc6c13ec-a30-polar-icp-hyperbolic"

              # FILL IN: set this to the output directory from as-jet-infer-job-30-icp-hyperbolic-compare
              # e.g. /mnt/data/output/2026-04-07_12-00-00--<pod-uid>-a30-icp-hyperbolic-compare-infer
              COMPARE_INFER_OUTPUT_PATH="FILL_IN_COMPARE_INFER_OUTPUT_PATH"

              UNIQUE_RUN_ID="$(date +%F_%H-%M-%S)--$POD_UID"
              OUT_DIR="/mnt/data/output/$UNIQUE_RUN_ID-a30-icp-hyperbolic-energy-dist"
              mkdir -p $OUT_DIR

              echo "=== Run 1: Euclidean samples ===" | tee -a ${OUT_DIR}/logs.txt
              python3 experiments/eval_energy_distribution.py \
                --gen_samples_path=${COMPARE_INFER_OUTPUT_PATH}/euclidean/samples.pt \
                --output_path=${TRAIN_OUTPUT_PATH} \
                --out_dir=${OUT_DIR}/euclidean \
                --label=euclidean \
                --num_particles=30 \
                | tee -a ${OUT_DIR}/logs.txt

              echo "=== Run 2: Hyperbolic samples ===" | tee -a ${OUT_DIR}/logs.txt
              python3 experiments/eval_energy_distribution.py \
                --gen_samples_path=${COMPARE_INFER_OUTPUT_PATH}/hyperbolic/samples.pt \
                --output_path=${TRAIN_OUTPUT_PATH} \
                --out_dir=${OUT_DIR}/hyperbolic \
                --label=hyperbolic \
                --num_particles=30 \
                | tee -a ${OUT_DIR}/logs.txt

          volumeMounts:
            - mountPath: /mnt/data
              name: as-train-pvc
          resources:
            limits:
              memory: "16Gi"
              cpu: "2.4"
            requests:
              memory: "8Gi"
              cpu: "2"
