# Joint g/q/t conditional pipeline flush at 30 and 150 particles.
apiVersion: v1
kind: List
items:
  - apiVersion: batch/v1
    kind: Job
    metadata: {name: as-jet-train-gqt30-lnet-h-200k}
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          volumes: &volumes
            - {name: data, persistentVolumeClaim: {claimName: as-jet-train-pvc-2}}
          containers:
            - name: train
              image: python:3.10-slim
              env:
                - {name: NUM_PARTICLES, value: "30"}
                - {name: RUN_CONFIG, value: gqt30-lorentznet-h-rfm-logmap-200k.yaml}
                - {name: RUN_LABEL, value: gqt30-lnet-h-200k}
                - name: POD_UID
                  valueFrom: {fieldRef: {fieldPath: metadata.uid}}
              command: &command
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  GIT_COMMIT="775bfd3d139302dea87a98c0a412d66b7b259515"
                  OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-$RUN_LABEL"
                  mkdir -p "$OUT" /tmp/runtime
                  exec > >(tee "$OUT/run.log") 2>&1
                  printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
                  tar -xf /mnt/data/caches/runtime/python-env-py310-torch271.tar -C /tmp/runtime
                  PYTHON=/tmp/runtime/python-env/bin/python
                  "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
                  mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
                  cd /tmp/repo/src
                  "$PYTHON" prepare_stage1.py --output-path "$OUT" \
                    --cache-dir /mnt/data/caches/stage1 --jet-types g q t \
                    --num-particles "$NUM_PARTICLES" --model-version v3
                  "$PYTHON" -m torch.distributed.run --standalone --nproc_per_node=1 train.py \
                    --config "configs/$RUN_CONFIG" --set paths.output_path="$OUT"
              volumeMounts: &mounts [{name: data, mountPath: /mnt/data}]
              resources:
                requests: {nvidia.com/a40: 1, cpu: "2", memory: 24Gi}
                limits: {nvidia.com/a40: 1, cpu: "2.4", memory: 24Gi}
  - apiVersion: batch/v1
    kind: Job
    metadata: {name: as-jet-train-gqt150-lnet-h-200k}
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          volumes: *volumes
          containers:
            - name: train
              image: python:3.10-slim
              env:
                - {name: NUM_PARTICLES, value: "150"}
                - {name: RUN_CONFIG, value: gqt150-lorentznet-h-rfm-logmap-200k.yaml}
                - {name: RUN_LABEL, value: gqt150-lnet-h-200k}
                - name: POD_UID
                  valueFrom: {fieldRef: {fieldPath: metadata.uid}}
              command: *command
              volumeMounts: *mounts
              resources:
                requests: {nvidia.com/a40: 1, cpu: "4", memory: 48Gi}
                limits: {nvidia.com/a40: 1, cpu: "6", memory: 48Gi}
