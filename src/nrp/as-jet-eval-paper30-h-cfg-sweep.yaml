# Guidance-weight sweep for the 994K CFG GQT checkpoint.
# Each indexed completion generates 50K jets per class and records both the
# aggregate metrics and class-stratified W1/FPD metrics for a matched comparison.
apiVersion: batch/v1
kind: Job
metadata: {name: as-jet-eval-paper30-h-cfg-sweep}
spec:
  ttlSecondsAfterFinished: 259200
  backoffLimit: 0
  completions: 6
  parallelism: 2
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rci-nautilus01.msu.montana.edu]
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: as-jet-train-pvc-2}}
      containers:
        - name: eval
          image: python:3.10-slim
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: OMP_NUM_THREADS, value: "2"}
            - {name: MKL_NUM_THREADS, value: "2"}
            - {name: OPENBLAS_NUM_THREADS, value: "1"}
            - {name: TORCH_NUM_THREADS, value: "2"}
            - {name: TORCH_NUM_INTEROP_THREADS, value: "1"}
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail
              GIT_COMMIT="4bc1acdd36d5711891045658c09482d997072838"
              SOURCE_RUN="/mnt/data/output/2026-08-21_10-04-25--cf87d826-9bab-45fb-b52e-02c9a60af5b8-gqt30-lnet-h-cfg-994k"
              CHECKPOINT="$SOURCE_RUN/train/models/final_checkpoint.pth"
              ENV_ARCHIVE="/mnt/data/caches/runtime/python-env-py310-torch271.tar"
              case "$JOB_COMPLETION_INDEX" in
                0) TAG="w025"; GUIDANCE="0.25" ;;
                1) TAG="w050"; GUIDANCE="0.50" ;;
                2) TAG="w075"; GUIDANCE="0.75" ;;
                3) TAG="w100"; GUIDANCE="1.00" ;;
                4) TAG="w200"; GUIDANCE="2.00" ;;
                5) TAG="w300"; GUIDANCE="3.00" ;;
                *) echo "Unexpected completion index: $JOB_COMPLETION_INDEX"; exit 1 ;;
              esac
              test -s "$CHECKPOINT"
              test -s "$ENV_ARCHIVE"
              OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-paper30-gqt994k-cfg-${TAG}-eval"
              mkdir -p "$OUT" /tmp/runtime
              exec > >(tee "$OUT/run.log") 2>&1
              printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
              printf '%s\n' "$SOURCE_RUN" > "$OUT/source_run.txt"
              printf '%s\n' "$CHECKPOINT" > "$OUT/checkpoint.txt"
              printf '%s\n' "$GUIDANCE" > "$OUT/cfg_guidance_weight.txt"
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src
              "$PYTHON" -c 'import sys,torch; p=sys.argv[1]; c=torch.load(p,map_location="cpu",weights_only=False); assert c["global_optimizer_step"]==994000, c["global_optimizer_step"]' "$CHECKPOINT"
              "$PYTHON" infer.py \
                --config configs/infer-g30-mass-shell.yaml \
                --set data.jet_types="[g,q,t]" \
                --set paths.checkpoint_path="$CHECKPOINT" \
                --set paths.output_path="$SOURCE_RUN" \
                --set paths.out_dir="$OUT/eval" \
                --set inference.n_samples=150000 \
                --set inference.samples_per_jet_type=50000 \
                --set inference.batch_size=128 \
                --set inference.integration_steps=64 \
                --set inference.prior_dist=axis_aligned_lognormal \
                --set inference.use_ema_weights=true \
                --set inference.use_cfg=true \
                --set inference.cfg_guidance_weight="$GUIDANCE" \
                --set inference.stratify_metrics_by_class=true \
                --set inference.skip_metrics=false
              for artifact in samples.pt prior_samples.pt replay_bundle.pt generation_diagnostics.json metrics.csv summary.json; do
                test -s "$OUT/eval/$artifact"
              done
              "$PYTHON" -c 'import json,sys,torch; bundle,summary=sys.argv[1:]; attrs=torch.load(bundle,map_location="cpu",weights_only=False)["generated_jet_attrs"]; ids=attrs[:,:5].argmax(-1); assert attrs.shape[0]==150000; assert torch.bincount(ids,minlength=5).tolist()[:3]==[50000,50000,50000], torch.bincount(ids,minlength=5).tolist(); d=json.load(open(summary)); m=d["metrics"]; assert d["stage_status"]["samples"]["status"]=="ok"; assert d["stage_status"]["metrics"]["status"]=="ok"; assert all(k in m for k in ("fpnd_g","fpnd_q","fpnd_t","w1m_g","w1m_q","w1m_t","w1p_g","w1p_q","w1p_t","fpd_g","fpd_q","fpd_t")); print({k:m[k] for k in m if k.startswith(("fpnd_","w1m_","fpd_"))})' "$OUT/eval/replay_bundle.pt" "$OUT/eval/summary.json"
          volumeMounts: [{name: data, mountPath: /mnt/data}]
          resources:
            requests: {nvidia.com/a40: 1, cpu: "2", memory: 32Gi}
            limits: {nvidia.com/a40: 1, cpu: "2.4", memory: 32Gi}
