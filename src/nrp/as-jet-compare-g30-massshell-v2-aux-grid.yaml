apiVersion: batch/v1
kind: Job
metadata:
  name: as-jet-compare-g30-massshell-v2-aux-grid
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: as-jet-train-pvc-2
      containers:
        - name: compare
          image: python:3.10-slim
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              GIT_COMMIT="1cff886dc8f9d4a0ed8ffbfb05cc03e2275f1fd6"
              ENV_ARCHIVE=/mnt/data/caches/runtime/python-env-py310-torch271.tar
              OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-g30-massshell-v2-aux-comparison"
              BASE="$(ls -dt /mnt/data/output/*-g30-massshell-v2-aux-base-stage1-v3-eval | head -n 1)"
              TOTAL="$(ls -dt /mnt/data/output/*-g30-massshell-v2-aux-total-stage1-v3-eval | head -n 1)"
              GRAM="$(ls -dt /mnt/data/output/*-g30-massshell-v2-aux-gram-stage1-v3-eval | head -n 1)"
              COMBINED="$(ls -dt /mnt/data/output/*-g30-massshell-v2-aux-combined-stage1-v3-eval | head -n 1)"
              test "$GIT_COMMIT" != "REPLACE_WITH_FROZEN_COMMIT_SHA"
              mkdir -p /tmp/runtime "$OUT"
              tar -xf "$ENV_ARCHIVE" -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src
              "$PYTHON" -m analysis.compare_aux_grid \
                --run "base=$BASE" --run "total=$TOTAL" \
                --run "gram=$GRAM" --run "combined=$COMBINED" \
                --output-dir "$OUT" 2>&1 | tee "$OUT/run.log"
              test -s "$OUT/aux_grid_comparison.json"
              test -s "$OUT/aux_grid_comparison.md"
          volumeMounts:
            - name: data
              mountPath: /mnt/data
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
