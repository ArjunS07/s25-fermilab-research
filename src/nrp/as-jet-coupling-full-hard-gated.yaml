apiVersion: v1
kind: List
items:
  # HARD GATE: do not replace the SHA or create these Jobs until design and smoke
  # artifacts have been reviewed. Full caches must already exist at typed config paths.
  - &coupling_full
    apiVersion: batch/v1
    kind: Job
    metadata: {name: as-jet-coupling-exact-100k}
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          volumes: &volumes
            - name: data
              persistentVolumeClaim: {claimName: as-jet-train-pvc-2}
          containers:
            - name: train
              image: python:3.10-slim
              env:
                - {name: ARM, value: exact}
                - name: POD_UID
                  valueFrom: {fieldRef: {fieldPath: metadata.uid}}
              command: &command
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  GIT_COMMIT="REPLACE_AFTER_SMOKE_REVIEW"
                  test "$GIT_COMMIT" != "REPLACE_AFTER_SMOKE_REVIEW"
                  case "$ARM" in
                    exact) CONFIG=g30-coupling-exact.yaml;;
                    canonical) CONFIG=g30-coupling-canonical.yaml;;
                    random) CONFIG=g30-coupling-random.yaml;;
                  esac
                  OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-g30-coupling-$ARM-100k"
                  mkdir -p "$OUT" /tmp/runtime
                  exec > >(tee "$OUT/run.log") 2>&1
                  printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
                  tar -xf /mnt/data/caches/runtime/python-env-py310-torch271.tar -C /tmp/runtime
                  PYTHON=/tmp/runtime/python-env/bin/python
                  "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
                  mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
                  cd /tmp/repo/src
                  "$PYTHON" prepare_stage1.py --output-path "$OUT" --cache-dir /mnt/data/caches/stage1 --jet-types g --num-particles 30 --model-version v3
                  "$PYTHON" -m torch.distributed.run --standalone --nproc_per_node=1 train.py --config "configs/$CONFIG" --set paths.output_path="$OUT"
              volumeMounts: &mounts [{name: data, mountPath: /mnt/data}]
              resources: &resources
                requests: {nvidia.com/a40: 1, cpu: "2", memory: 24Gi}
                limits: {nvidia.com/a40: 1, cpu: "2.4", memory: 24Gi}
  - <<: *coupling_full
    metadata: {name: as-jet-coupling-canonical-100k}
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          volumes: *volumes
          containers: [{name: train, image: "python:3.10-slim", env: [{name: ARM, value: canonical}, {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}], command: *command, volumeMounts: *mounts, resources: *resources}]
  - <<: *coupling_full
    metadata: {name: as-jet-coupling-random-100k}
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          volumes: *volumes
          containers: [{name: train, image: "python:3.10-slim", env: [{name: ARM, value: random}, {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}], command: *command, volumeMounts: *mounts, resources: *resources}]
