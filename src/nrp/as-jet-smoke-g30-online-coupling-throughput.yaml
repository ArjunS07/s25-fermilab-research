apiVersion: batch/v1
kind: Job
metadata: {name: as-jet-smoke-g30-icp-gpu-r3}
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rci-nautilus01.msu.montana.edu]
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: as-jet-train-pvc-2}}
      containers:
        - name: train
          image: python:3.10-slim
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: OMP_NUM_THREADS, value: "2"}
            - {name: MKL_NUM_THREADS, value: "2"}
            - {name: OPENBLAS_NUM_THREADS, value: "1"}
            - {name: TORCH_NUM_THREADS, value: "2"}
            - {name: TORCH_NUM_INTEROP_THREADS, value: "1"}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail
              ARM="gpu-r3"
              GIT_COMMIT="8bd68dc85a9bd6eaa0e943fb4386509e4533bd12"
              CONFIG="configs/g30-lorentznet-h-rfm-logmap-tangentrefs-994k.yaml"
              OUT="/mnt/data/output/$(date +%F_%H-%M-%S)--$POD_UID-g30-icp-$ARM-smoke"
              mkdir -p "$OUT" /tmp/runtime
              exec > >(tee "$OUT/run.log") 2>&1
              printf '%s\n' "$GIT_COMMIT" > "$OUT/git_commit.txt"
              tar -xf /mnt/data/caches/runtime/python-env-py310-torch271.tar -C /tmp/runtime
              PYTHON=/tmp/runtime/python-env/bin/python
              "$PYTHON" -c "import tarfile,urllib.request; u='https://github.com/ArjunS07/s25-fermilab-research/archive/'+'$GIT_COMMIT'+'.tar.gz'; urllib.request.urlretrieve(u,'/tmp/repo.tar.gz'); tarfile.open('/tmp/repo.tar.gz').extractall('/tmp')"
              mv "/tmp/s25-fermilab-research-$GIT_COMMIT" /tmp/repo
              cd /tmp/repo/src
              "$PYTHON" -c 'import torch; from util.geometry.online_coupling import online_geodesic_coupling as f; B,P=8,30; g=torch.Generator().manual_seed(23); x0=torch.randn(B,P,4,generator=g); x1=torch.randn(B,P,4,generator=g); mask=torch.zeros(B,P); ns=[30,27,24,20,12,6,1,0]; [mask.__setitem__((b,slice(None,n)),1) for b,n in enumerate(ns)]; cpu=f(x0,x1,mask,0.1); gpu=f(x0.cuda(),x1.cuda(),mask.cuda(),0.1).cpu(); print("CUDA coupling parity:",torch.equal(cpu,gpu)); assert torch.equal(cpu,gpu)'
              "$PYTHON" prepare_stage1.py --output-path "$OUT" --cache-dir /mnt/data/caches/stage1 --jet-types g --num-particles 30 --model-version v3
              "$PYTHON" train.py \
                --config "$CONFIG" --set paths.output_path="$OUT" \
                --set training.num_epochs=2 --set training.max_optimizer_steps=500 \
                --set training.lr_warmup_steps=50 \
                --set training.stability_probe_steps="[0,500]" \
                --set inference.n_samples=1000 --set inference.integration_steps=4
          volumeMounts: [{name: data, mountPath: /mnt/data}]
          resources:
            requests: {nvidia.com/a40: 1, cpu: "2", memory: 24Gi}
            limits: {nvidia.com/a40: 1, cpu: "2.4", memory: 24Gi}
