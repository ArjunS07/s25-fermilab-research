apiVersion: batch/v1
kind: Job
metadata:
  name: as-jet-train-job-g30-phase1-y-cond-lr03
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: as-train-pvc
          persistentVolumeClaim:
            claimName: as-jet-train-pvc-2

      containers:
        - name: train
          image: python:3.10-slim
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          command:
            - /bin/bash
            - -c
            - |
              set -e
              set -ex
              set -o pipefail
              # Wave 1' Y-cond stability probe (lr03): retrain g30-phase1-y-cond with new schedule
              apt-get update && apt-get install -y libffi-dev gcc g++ curl git wget build-essential

              mkdir -p /mnt/data
              ls -la /mnt/data

              git clone https://github.com/ArjunS07/s25-fermilab-research /tmp/repo

              # --- Frozen-harness gate (experiment plan 0.4) ---
              # Pin every Phase-1 run to one commit so grid numbers are comparable. Replace the
              # placeholder with the frozen SHA before launching; the run records it below.
              GIT_COMMIT="40944c63c627b8796f74fff018c7c5c854bcc650"
              if [ "$GIT_COMMIT" = "REPLACE_WITH_FROZEN_COMMIT_SHA" ]; then
                echo "ERROR: GIT_COMMIT is not pinned. Set it to the frozen harness commit SHA"
                echo "       before launching a Phase-1 grid run (experiment plan hard gate)."
                exit 1
              fi
              git -C /tmp/repo checkout "$GIT_COMMIT"
              cp -r /tmp/repo/src /mnt/data/

              if [ -d "/mnt/data/python-env" ] && /mnt/data/python-env/bin/python -c "import torch; print('Environment OK')" 2>/dev/null; then
                echo "=== Existing environment is working, skipping setup ==="
                source /mnt/data/python-env/bin/activate
              else
                rm -rf /mnt/data/python-env
                python -m venv /mnt/data/python-env
                source /mnt/data/python-env/bin/activate
                pip install torch --index-url https://download.pytorch.org/whl/cu121
                if [ -f /mnt/data/src/requirements.txt ]; then
                  pip install -r /mnt/data/src/requirements.txt
                else
                  echo "No requirements.txt found, skipping pip install"
                fi
              fi

              # --- FPND metric dependencies (torch_geometric + compiled PyG extensions) ---
              # Installed idempotently here (outside the cached-env branch above), since pods
              # reuse /mnt/data/python-env and skip the setup else-block. Wheel index matches
              # the installed torch (2.7.1, CUDA 12.6 from PyPI). Non-fatal: FPND is optional,
              # so a wheel-install failure must not kill the run.
              pip install torch_geometric \
                || echo "WARN: torch_geometric install failed; FPND will be skipped"
              pip install torch_scatter torch_sparse torch_cluster \
                -f https://data.pyg.org/whl/torch-2.7.1+cu126.html \
                || echo "WARN: PyG compiled extensions install failed; FPND will be skipped"

              echo "=== Environment setup complete, starting training ==="

              cd /mnt/data/src

              UNIQUE_RUN_ID="$(date +%F_%H-%M-%S)--$POD_UID"
              OUTPUT_PATH="/mnt/data/output/$UNIQUE_RUN_ID-g30-phase1-y-cond-lr03"
              echo "Output path: $OUTPUT_PATH"
              mkdir -p $OUTPUT_PATH
              git -C /tmp/repo rev-parse HEAD > ${OUTPUT_PATH}/git_commit.txt

              python3 data.py --jet_types g --num_particles=30 --output_path=${OUTPUT_PATH}
              python3 jet_attr_model.py --output_path=${OUTPUT_PATH}
              NGPU=$(python3 -c "import torch; print(torch.cuda.device_count())")
              echo "Launching training on ${NGPU:-1} GPU(s) via torchrun"
              torchrun --standalone --nproc_per_node=${NGPU:-1} train.py \
                --config configs/g30-phase1-y-cond-lr03.yaml \
                --set paths.output_path=${OUTPUT_PATH} \
                | tee -a ${OUTPUT_PATH}/logs.txt
          volumeMounts:
            - mountPath: /mnt/data
              name: as-train-pvc
          resources:
            limits:
              nvidia.com/a40: 1
              memory: "16Gi"
              cpu: "2.4"
            requests:
              nvidia.com/a40: 1
              memory: "16Gi"
              cpu: "2"
