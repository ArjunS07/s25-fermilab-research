apiVersion: v1
kind: Pod
metadata:
  name: as-jet-training-pod
spec:
  restartPolicy: Never
  volumes:
    - name: as-train-pvc
      persistentVolumeClaim:
        claimName: as-jet-training-pvc

  initContainers:
  - name: setup-env
    image: python:3.10-slim
    command:
      - /bin/bash
      - -c
      - |
        set -ex
        apt-get update && apt-get install -y libffi-dev gcc g++ curl git wget
        
        # Ensure the mount directory exists and is writable
        mkdir -p /mnt/data
        ls -la /mnt/data

        rm -rf /mnt/data/python-env
        
        # Create the virtual environment
        python -m venv /mnt/data/python-env
        source /mnt/data/python-env/bin/activate
        pip install --upgrade pip
        
        # Clone repository
        git clone https://github.com/ArjunS07/s25-fermilab-research /tmp/repo
        cp -r /tmp/repo/src /mnt/data/

        # Install requirements (ignore failure if requirements.txt missing)
        if [ -f /mnt/data/src/requirements.txt ]; then
          pip install -r /mnt/data/src/requirements.txt
        else
          echo "No requirements.txt found, skipping pip install"
        fi
        
        apiVersion: v1
kind: Pod
metadata:
  name: as-jet-training-pod
spec:
  restartPolicy: Never
  volumes:
    - name: as-train-pvc
      persistentVolumeClaim:
        claimName: as-jet-training-pvc

  initContainers:
  - name: setup-env
    image: python:3.10-slim
    command:
      - /bin/bash
      - -c
      - |
        set -ex
        apt-get update && apt-get install -y libffi-dev gcc g++ curl git wget build-essential
        
        # Ensure the mount directory exists and is writable
        mkdir -p /mnt/data
        ls -la /mnt/data

        rm -rf /mnt/data/python-env
        
        # Create the virtual environment
        python -m venv /mnt/data/python-env
        source /mnt/data/python-env/bin/activate
        pip install --upgrade pip
        
        # Clone repository
        git clone https://github.com/ArjunS07/s25-fermilab-research /tmp/repo
        cp -r /tmp/repo/src /mnt/data/

        # Install PyTorch with CUDA support
        pip install torch --index-url https://download.pytorch.org/whl/cu121

        # Install requirements (ignore failure if requirements.txt missing)
        if [ -f /mnt/data/src/requirements.txt ]; then
          pip install -r /mnt/data/src/requirements.txt
        else
          echo "No requirements.txt found, skipping pip install"
        fi

        TORCH_VERSION=$(python -c "import torch; print(torch.__version__)")
        echo "PyTorch version: $TORCH_VERSION"
        
        # Install torch-geometric and related packages using pre-compiled wheels
        pip install torch-geometric -f https://data.pyg.org/whl/torch-${TORCH_VERSION}+cpu.html || \
        pip install torch-geometric
        # Install torch-cluster using pre-compiled wheels or fallback to source
        pip install torch-cluster -f https://data.pyg.org/whl/torch-${TORCH_VERSION}+cpu.html || \
        pip install torch-cluster --no-cache-dir --verbose
        
        # If that fails, try installing without build isolation
        if ! python -c "import torch_cluster" 2>/dev/null; then
          echo "Retrying torch-cluster installation without build isolation..."
          pip install torch-cluster --no-build-isolation --no-cache-dir
        fi
        
        # Verify installations
        python -c "import torch; print('PyTorch:', torch.__version__)"
        python -c "import torch; print('CUDA available:', torch.cuda.is_available())"
        python -c "import torch; print('CUDA version:', torch.version.cuda)"
        python -c "import torch_geometric; print('PyTorch Geometric installed successfully')"
        python -c "import torch_cluster; print('PyTorch Cluster installed successfully')"
        
    volumeMounts:
      - mountPath: /mnt/data
        name: as-train-pvc

    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1"

  containers:
  - name: trainer
    image: python:3.10-slim
    command:
      - /bin/bash
      - -c
      - |
        # Verify the virtual environment exists
        if [ ! -f /mnt/data/python-env/bin/activate ]; then
          echo "Virtual environment not found!"
          exit 1
        fi
        
        source /mnt/data/python-env/bin/activate
        TORCH_VERSION=$(python -c "import torch; print(torch.__version__)")
        python /mnt/data/src/train.py --out_dir /mnt/data/output
    volumeMounts:
      - mountPath: /mnt/data
        name: as-train-pvc
    resources:
      limits:
        nvidia.com/gpu: 1
        memory: "16Gi"
        cpu: "4"
      requests:
        nvidia.com/gpu: 1
        memory: "8Gi"
        cpu: "2"