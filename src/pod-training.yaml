apiVersion: v1
kind: Pod
metadata:
  name: as-jet-training-pod
spec:
  restartPolicy: Never
  volumes:
    - name: as-train-pvc
      persistentVolumeClaim:
        claimName: as-jet-training-pvc

  initContainers:
  - name: setup-env
    image: python:3.10-slim
    command:
      - /bin/bash
      - -c
      - |
        set -ex
        apt-get update && apt-get install -y libffi-dev gcc g++ curl git wget
        
        # Ensure the mount directory exists and is writable
        mkdir -p /mnt/data
        ls -la /mnt/data

        rm -rf /mnt/data/python-env
        
        # Create the virtual environment
        python -m venv /mnt/data/python-env
        source /mnt/data/python-env/bin/activate
        pip install --upgrade pip
        
        # Clone repository
        git clone https://github.com/ArjunS07/s25-fermilab-research /tmp/repo
        cp -r /tmp/repo/src /mnt/data/

        # Install requirements (ignore failure if requirements.txt missing)
        if [ -f /mnt/data/src/requirements.txt ]; then
          pip install -r /mnt/data/src/requirements.txt
        else
          echo "No requirements.txt found, skipping pip install"
        fi
        pip install torch
        pip install torch-geometric torch-cluster
    volumeMounts:
      - mountPath: /mnt/data
        name: as-train-pvc

    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1"

  containers:
  - name: trainer
    image: python:3.10-slim
    command:
      - /bin/bash
      - -c
      - |
        # Verify the virtual environment exists
        if [ ! -f /mnt/data/python-env/bin/activate ]; then
          echo "Virtual environment not found!"
          exit 1
        fi
        
        source /mnt/data/python-env/bin/activate
        python /mnt/data/src/train.py --out_dir /mnt/data/output
    volumeMounts:
      - mountPath: /mnt/data
        name: as-train-pvc
    resources:
      limits:
        nvidia.com/gpu: 1
        memory: "16Gi"
        cpu: "4"
      requests:
        nvidia.com/gpu: 1
        memory: "8Gi"
        cpu: "2"