apiVersion: v1
kind: Pod
metadata:
  name: as-jet-training-pod
spec:
  restartPolicy: Never
  volumes:
    - name: as-train-pvc
      persistentVolumeClaim:
        claimName: as-jet-training-pvc
  initContainers:
  - name: setup-env
    image: python:3.10-slim
    command:
      - /bin/bash
      - -c
      - |
        set -ex
        apt-get update && apt-get install -y libffi-dev gcc g++ curl git wget build-essential
        
        # Ensure the mount directory exists and is writable
        mkdir -p /mnt/data
        ls -la /mnt/data

        rm -rf /mnt/data/python-env
        
        # Create the virtual environment
        python -m venv /mnt/data/python-env
        source /mnt/data/python-env/bin/activate
        pip install --upgrade pip
        
        # Clone repository
        git clone https://github.com/ArjunS07/s25-fermilab-research /tmp/repo
        cp -r /tmp/repo/src /mnt/data/

        # Install PyTorch with CUDA support
        pip install torch --index-url https://download.pytorch.org/whl/cu121

        # Install requirements (ignore failure if requirements.txt missing)
        if [ -f /mnt/data/src/requirements.txt ]; then
          pip install -r /mnt/data/src/requirements.txt
        else
          echo "No requirements.txt found, skipping pip install"
        fi

        TORCH_VERSION=$(python -c "import torch; print(torch.__version__)")
        echo "PyTorch version: $TORCH_VERSION"

        
        apiVersion: v1
  containers:
  - name: debug
    image: python:3.10-slim
    command:
      - /bin/bash
      - -c
      - |
        echo "=== Activating your existing environment ==="
        source /mnt/data/python-env/bin/activate
        
        # Install Jupyter in existing environment
        pip install jupyter ipython
        
        # Set debugging environment variables
        export CUDA_LAUNCH_BLOCKING=1
        export TORCH_USE_CUDA_DSA=1
        
        echo "=== Environment ready ==="
        echo "GPU info check:"
        python -c "import torch; print('CUDA available:', torch.cuda.is_available()); print('Device count:', torch.cuda.device_count())"
        
        echo "=== Starting Jupyter ==="
        echo "Run: kubectl port-forward as-jet-debug-minimal 8888:8888"
        echo "Then open: http://localhost:8888"
        
        # Start Jupyter
        cd /mnt/data/src
        jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --token='' --password=''
        
    ports:
    - containerPort: 8888
    volumeMounts:
      - mountPath: /mnt/data
        name: as-train-pvc
    resources:
      limits:
        nvidia.com/gpu: 2
        memory: "16Gi"
        cpu: "4"
      requests:
        nvidia.com/gpu: 2
        memory: "16Gi"
        cpu: "2"