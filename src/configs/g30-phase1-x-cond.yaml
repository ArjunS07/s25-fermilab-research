# Wave 1' X-cond: node scalars seeded from jet_conditions broadcast + axis-aligned prior.
# h_i starts from Lorentz-invariant jet-class/multiplicity/pT signal, no Minkowski
# hooks. Tests whether h_i-as-info-channel with a non-trivial seed helps on top of
# the aligned prior.
data:
  jet_types: ["g"]
  num_particles: 30

model:
  use_residual: true
  use_node_scalars: true
  node_scalar_seed: conditions

training:
  train_space: polar
  time_sampling: power_law
  batch_size: 50
  num_epochs: 200
  use_cosine_lr: true
  use_time_sampling: true
  use_curriculum: false
  prior_dist: axis_aligned

inference:
  n_samples: 50000
  integration_steps: 64
