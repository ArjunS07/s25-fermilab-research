data:
  jet_types: ["g"]
  num_particles: 30

model:
  # Deliberately compact: 0.48M parameters, close to L-GATr's reported 0.54M.
  n_hidden: 64
  n_layers: 6
  use_reference_vectors: true
  include_mass_condition: true
  regulator_mass: 0.1

training:
  n_train_samples: 1000000
  batch_size: 50
  target_batch_size: 250
  cfg_null_dropout_rate: 0.0
  # 202 epochs provide enough minibatches to stop at exactly 100k optimizer
  # updates; the explicit step cap is the reproducible compute contract.
  num_epochs: 202
  max_optimizer_steps: 100000
  stability_probe_steps: [0, 100, 500, 1000, 2000, 5000, 10000, 20000, 40000, 60000, 80000, 100000]
  stability_probe_save_checkpoints: true
  qualification_min_loss_improvement: 0.1
  time_sampling: uniform
  use_time_sampling: false
  use_curriculum: false
  prior_dist: axis_aligned_per_jet
  # Fresh prior noise every step + online squared-geodesic ICP coupling (no frozen cache;
  # prevents path memorization — see discussions/22).
  coupling: online_geodesic_icp
  use_ema: true
  ema_decay: 0.999
  use_cosine_lr: true
  lr_schedule: monotonic_cosine
  lr_warmup_epochs: 10
  eta_min_factor: 0.03

inference:
  n_samples: 50000
  batch_size: 128
  integration_steps: 64
  prior_dist: axis_aligned_per_jet
  sampler: euler
  warn_invalid_fraction: 0.0
  max_invalid_fraction: 0.001
  stability_probe_samples: 64
  stability_probe_integration_steps: 8
  skip_metrics: false

paths:
  cache_dir: /mnt/data/caches
