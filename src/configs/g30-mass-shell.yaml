# Phase 4 mass-shell RFM run (gluon-30). Flag-gated; written for a future launch, NOT yet run.
# Pairs naturally with a mass_shell ICP cache built by cache_icp.py with
#   --set cache.geometry=mass_shell --set cache.regulator_mass=0.1
data:
  jet_types: ["g"]
  num_particles: 30

model:
  use_residual: true
  use_hyperbolic: true
  hyperbolic_model: mass_shell
  regulator_mass: 0.1

training:
  # The shell geometry interpolates on Cartesian on-shell 4-vectors; train_space (polar vs
  # cartesian) only affects the Euclidean branch and is ignored here.
  train_space: cartesian
  time_sampling: power_law
  batch_size: 50
  num_epochs: 200
  use_cosine_lr: true
  use_time_sampling: true
  use_curriculum: false

inference:
  n_samples: 50000
  integration_steps: 64

paths:
  cache_dir: /mnt/data/caches
