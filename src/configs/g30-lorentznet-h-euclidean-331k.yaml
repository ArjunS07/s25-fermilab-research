# Euclidean-compatible H geometry-stack ablation at the 331K compute budget.
#
# H's normalized log-map particle directions and normalized tangent references are
# defined only on the regulated mass shell.  The Euclidean control therefore uses
# their parameter-matched ambient/plain counterparts.  Every non-geometric choice,
# including online geodesic ICP, is held fixed against the G-331K H baseline.
data: {jet_types: [g], num_particles: 30}
model:
  architecture: lorentznet
  flow_geometry: euclidean
  reference_mode: plain_readout
  scalar_init_mode: reference_contractions
  particle_readout_mode: ambient
  geometry_mode: evolving_auxiliary
  field_degree_normalization: none
  inject_condition_time_each_block: false
  use_reference_vectors: true
  n_hidden: 96
  n_layers: 6
  regulator_mass: 0.1
training:
  n_train_samples: 1000000
  batch_size: 50
  target_batch_size: 250
  cfg_null_dropout_rate: 0.0
  num_epochs: 800
  max_optimizer_steps: 331000
  stability_probe_steps: [0, 1000, 5000, 20000, 40000, 80000, 150000, 200000, 331000]
  stability_probe_save_checkpoints: true
  time_sampling: uniform
  use_time_sampling: false
  use_curriculum: false
  prior_dist: axis_aligned_lognormal
  coupling: online_geodesic_icp
  use_ema: true
  ema_decay: 0.999
  lr: 0.0006
  weight_decay: 0.000001
  use_cosine_lr: true
  lr_schedule: monotonic_cosine
  lr_step_unit: optimizer_step
  lr_warmup_steps: 2000
  eta_min_factor: 0.03
  model_seed: 42
  data_order_seed: 1042
  time_seed: 2042
  dropout_seed: 3042
  prior_seed: 4042
inference:
  n_samples: 50000
  batch_size: 128
  integration_steps: 64
  integration_end_time: 0.99999
  prior_dist: axis_aligned_lognormal
  seed: 42
  use_cfg: false
  use_ema_weights: true
  # Ignored by Euclidean integration, retained so the serialized control config
  # differs from H only where geometry mathematically requires it.
  warn_invalid_fraction: 0.0
  max_invalid_fraction: 0.001
paths: {cache_dir: /mnt/data/caches}
