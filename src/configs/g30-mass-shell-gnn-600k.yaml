# 600k reference grid for the mass-shell GNN 2x2 (geometric_state x global_pooling).
# Identical recipe to the width-128 msgnn-d 600k run (fresh prior + online squared-geodesic
# ICP, monotonic-cosine optimizer-step LR at 6e-4, warmup 10, eta_min 0.03) EXCEPT the width
# is dropped to 96 so the leanest cell (readout_only/no-pool) is ~513k params, below L-GATr's
# ~540k generator. The manifest overrides geometric_state / use_global_pooling per arm.
data: {jet_types: [g], num_particles: 30}
model:
  n_hidden: 96
  n_layers: 4
  use_reference_vectors: true
  include_mass_condition: true
  regulator_mass: 0.1
training:
  n_train_samples: 1000000
  batch_size: 50
  target_batch_size: 250
  cfg_null_dropout_rate: 0.0
  num_epochs: 1212
  max_optimizer_steps: 600000
  stability_probe_steps: [0, 20000, 40000, 80000, 150000, 300000, 450000, 600000]
  stability_probe_save_checkpoints: true
  qualification_min_loss_improvement: null
  time_sampling: uniform
  use_time_sampling: false
  use_curriculum: false
  prior_dist: axis_aligned_per_jet
  coupling: online_geodesic_icp
  use_ema: true
  ema_decay: 0.999
  lr: 0.0006
  use_cosine_lr: true
  lr_schedule: monotonic_cosine
  lr_step_unit: optimizer_step
  lr_warmup_epochs: 10
  eta_min_factor: 0.03
inference:
  n_samples: 50000
  batch_size: 128
  integration_steps: 64
  prior_dist: axis_aligned_per_jet
  sampler: euler
  mass_shell_max_step_rapidity: 0.5
  mass_shell_max_substeps: 64
  warn_invalid_fraction: 0.0
  max_invalid_fraction: 0.001
paths:
  cache_dir: /mnt/data/caches
