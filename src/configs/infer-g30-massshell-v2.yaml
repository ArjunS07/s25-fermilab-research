data:
  jet_types: [g]
  num_particles: 30

# ema_model.pth is a raw state dict, so keep the architecture explicit here.
model:
  backbone: tangent_attention
  n_hidden: 256
  n_layers: 6
  use_residual: true
  use_reference_vectors: true
  include_mass_condition: true
  num_attention_heads: 8
  vector_channels: 16
  velocity_readout_init: zero
  use_hyperbolic: true
  hyperbolic_model: mass_shell
  regulator_mass: 0.1

inference:
  n_samples: 50000
  integration_steps: 64
  batch_size: 128
  seed: 42
  use_cfg: false
  sampler: euler
  mass_shell_max_step_rapidity: 0.5
  mass_shell_max_substeps: 64
  vf_mode: none
  prior_dist: axis_aligned_per_jet
  skip_metrics: false
