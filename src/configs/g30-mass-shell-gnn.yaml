# Full-run template. The manifest must override LR/cadence after the causality gate.
data: {jet_types: [g], num_particles: 30, stage1_model_version: v3}
model:
  backbone: mass_shell_gnn
  geometric_state: readout_only
  use_global_pooling: false
  n_hidden: 128
  n_layers: 4
  vector_channels: 8
  velocity_readout_init: small_normal
  use_reference_vectors: true
  include_mass_condition: true
  use_hyperbolic: true
  hyperbolic_model: mass_shell
  regulator_mass: 0.1
training:
  n_train_samples: 1000000
  batch_size: 50
  target_batch_size: 250
  cfg_null_dropout_rate: 0.0
  num_epochs: 202
  max_optimizer_steps: 100000
  stability_probe_steps: [0, 10000, 20000, 40000, 60000, 80000, 100000]
  stability_probe_save_checkpoints: true
  qualification_min_loss_improvement: null
  time_sampling: uniform
  use_time_sampling: false
  use_curriculum: false
  prior_dist: axis_aligned_per_jet
  use_icp: true
  icp_assignment_cost: squared_geodesic
  use_ema: true
  ema_decay: 0.999
  lr: 0.0006
  use_cosine_lr: true
  lr_schedule: legacy_restarts
  lr_step_unit: epoch
  lr_t0: 0
inference:
  n_samples: 50000
  batch_size: 128
  integration_steps: 64
  prior_dist: axis_aligned_per_jet
  sampler: euler
  mass_shell_max_step_rapidity: 0.5
  mass_shell_max_substeps: 64
  warn_invalid_fraction: 0.0
  max_invalid_fraction: 0.001
paths:
  cache_dir: /mnt/data/caches
  icp_cache_path: /mnt/data/caches/g_p30_v2_massshell_m01_phi-v1-d2/icp_cache.pkl
