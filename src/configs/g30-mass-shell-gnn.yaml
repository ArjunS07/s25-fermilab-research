# Full-run template. The manifest must override LR/cadence after the causality gate.
data: {jet_types: [g], num_particles: 30}
model:
  n_hidden: 128
  n_layers: 4
  use_reference_vectors: true
  include_mass_condition: true
  regulator_mass: 0.1
training:
  n_train_samples: 1000000
  batch_size: 50
  target_batch_size: 250
  cfg_null_dropout_rate: 0.0
  num_epochs: 202
  max_optimizer_steps: 100000
  stability_probe_steps: [0, 10000, 20000, 40000, 60000, 80000, 100000]
  stability_probe_save_checkpoints: true
  qualification_min_loss_improvement: null
  time_sampling: uniform
  use_time_sampling: false
  use_curriculum: false
  prior_dist: axis_aligned_per_jet
  # Fresh prior noise every step + online squared-geodesic ICP coupling, and the same
  # monotonic-cosine optimizer-step LR contract as the fresh+online-ICP reference run,
  # so the GNN-vs-tangent-attention comparison differs only in architecture.
  coupling: online_geodesic_icp
  use_ema: true
  ema_decay: 0.999
  lr: 0.0006
  use_cosine_lr: true
  lr_schedule: monotonic_cosine
  lr_step_unit: optimizer_step
  lr_warmup_epochs: 10
  eta_min_factor: 0.03
inference:
  n_samples: 50000
  batch_size: 128
  integration_steps: 64
  prior_dist: axis_aligned_per_jet
  sampler: euler
  warn_invalid_fraction: 0.0
  max_invalid_fraction: 0.001
paths:
  cache_dir: /mnt/data/caches
