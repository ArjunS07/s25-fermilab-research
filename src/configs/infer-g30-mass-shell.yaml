data:
  jet_types: ["g"]
  num_particles: 30
  stage1_model_version: v3

# Architecture is normally reconstructed from the checkpoint. These values make
# the standalone config self-consistent and provide an explicit fallback.
model:
  backbone: tangent_attention
  n_hidden: 64
  n_layers: 6
  use_reference_vectors: true
  include_mass_condition: true
  num_attention_heads: 8
  vector_channels: 16
  velocity_readout_init: zero
  use_hyperbolic: true
  hyperbolic_model: mass_shell
  regulator_mass: 0.1

inference:
  n_samples: 50000
  batch_size: 128
  integration_steps: 64
  prior_dist: axis_aligned_per_jet
  sampler: euler
  mass_shell_max_step_rapidity: 0.5
  mass_shell_max_substeps: 64
  use_cfg: false
  use_ema_weights: true
  warn_invalid_fraction: 0.0
  max_invalid_fraction: 0.001
  skip_metrics: false

paths:
  cache_dir: /mnt/data/caches
