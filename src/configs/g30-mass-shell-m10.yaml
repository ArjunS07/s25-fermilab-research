# Wave 3 mass sweep: m=1.0 (kinematic-distortion end).
data:
  jet_types: ["g"]
  num_particles: 30

model:
  use_residual: true
  use_hyperbolic: true
  hyperbolic_model: mass_shell
  regulator_mass: 1.0

training:
  train_space: cartesian
  time_sampling: power_law
  batch_size: 50
  num_epochs: 200
  use_cosine_lr: true
  use_time_sampling: true
  use_curriculum: false
  prior_dist: axis_aligned

inference:
  n_samples: 50000
  integration_steps: 64
  prior_dist: axis_aligned

paths:
  cache_dir: /mnt/data/caches
