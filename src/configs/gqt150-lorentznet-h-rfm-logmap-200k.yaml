# Joint g/q/t size-150 pipeline run using H with a memory-safe minibatch.
data: {jet_types: [g, q, t], num_particles: 150}
model:
  architecture: lorentznet
  flow_geometry: mass_shell
  reference_mode: normalized_tangent_readout
  scalar_init_mode: reference_contractions
  particle_readout_mode: normalized_logmap
  geometry_mode: evolving_auxiliary
  field_degree_normalization: sqrt
  inject_condition_time_each_block: false
  use_reference_vectors: true
  n_hidden: 96
  n_layers: 6
  include_mass_condition: true
  regulator_mass: 0.1
training:
  n_train_samples: 1000000
  batch_size: 5
  target_batch_size: 250
  cfg_null_dropout_rate: 0.0
  num_epochs: 1000
  max_optimizer_steps: 200000
  stability_probe_steps: [0, 20000, 40000, 80000, 150000, 200000]
  stability_probe_save_checkpoints: true
  time_sampling: uniform
  use_time_sampling: false
  use_curriculum: false
  prior_dist: axis_aligned_lognormal
  coupling: online_geodesic_icp
  use_ema: true
  ema_decay: 0.999
  lr: 0.0006
  weight_decay: 0.000001
  use_cosine_lr: true
  lr_schedule: monotonic_cosine
  lr_step_unit: optimizer_step
  lr_warmup_steps: 2000
  eta_min_factor: 0.03
  model_seed: 42
  data_order_seed: 1042
  time_seed: 2042
  dropout_seed: 3042
  prior_seed: 4042
inference:
  n_samples: 50000
  batch_size: 16
  integration_steps: 64
  integration_end_time: 0.99999
  prior_dist: axis_aligned_lognormal
  sampler: euler
  seed: 42
  use_cfg: false
  use_ema_weights: true
  warn_invalid_fraction: 0.0
  max_invalid_fraction: 0.001
paths: {cache_dir: /mnt/data/caches}
