# Wave 1' y-cond stability probe: retrain y-cond with LR * 0.3 (1.8e-4).
# Everything else identical to g30-phase1-y-cond.yaml.
data:
  jet_types: ["g"]
  num_particles: 30

model:
  use_residual: true
  use_node_scalars: true
  node_scalar_seed: conditions

training:
  train_space: polar
  time_sampling: power_law
  batch_size: 50
  num_epochs: 200
  use_cosine_lr: true
  use_time_sampling: true
  use_curriculum: false
  prior_dist: isotropic_com
  lr: 1.8e-4

inference:
  n_samples: 50000
  integration_steps: 64
