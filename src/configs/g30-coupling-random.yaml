data: {jet_types: ["g"], num_particles: 30, stage1_model_version: v3}
model:
  backbone: tangent_attention
  n_hidden: 256
  n_layers: 6
  use_reference_vectors: true
  include_mass_condition: true
  num_attention_heads: 8
  vector_channels: 16
  velocity_readout_init: zero
  use_hyperbolic: true
  hyperbolic_model: mass_shell
  regulator_mass: 0.1
training:
  n_train_samples: 1000000
  batch_size: 50
  target_batch_size: 250
  cfg_null_dropout_rate: 0.0
  num_epochs: 202
  max_optimizer_steps: 100000
  stability_probe_steps: [0, 100, 500, 1000, 2000, 5000, 10000, 20000, 40000, 60000, 80000, 100000]
  stability_probe_save_checkpoints: true
  qualification_min_loss_improvement: 0.1
  train_space: cartesian
  time_sampling: uniform
  use_time_sampling: false
  use_curriculum: false
  prior_dist: axis_aligned_per_jet
  use_icp: true
  icp_assignment_cost: squared_geodesic
  particle_coupling: random_frozen
  coupling_seed: 5042
  use_ema: true
  ema_decay: 0.999
  lr: 0.0003
  use_cosine_lr: true
  lr_schedule: monotonic_cosine
  lr_step_unit: optimizer_step
  lr_warmup_epochs: 10
  eta_min_factor: 0.03
inference:
  n_samples: 50000
  batch_size: 128
  integration_steps: 64
  prior_dist: axis_aligned_per_jet
  sampler: euler
  mass_shell_max_step_rapidity: 0.5
  mass_shell_max_substeps: 64
  warn_invalid_fraction: 0.0
  max_invalid_fraction: 0.001
  stability_probe_samples: 64
  stability_probe_integration_steps: 8
  skip_metrics: false
paths:
  cache_dir: /mnt/data/caches
  icp_cache_path: /mnt/data/caches/coupling-g30/random/icp_cache.pkl
