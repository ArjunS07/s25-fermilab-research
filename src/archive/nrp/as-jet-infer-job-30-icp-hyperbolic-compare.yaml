apiVersion: batch/v1
kind: Job
metadata:
  name: as-jet-infer-job-30-icp-hyperbolic-compare
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: as-train-pvc
          persistentVolumeClaim:
            claimName: as-jet-train-pvc

      containers:
        - name: infer
          image: python:3.10-slim
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          command:
            - /bin/bash
            - -c
            - |
              set -e
              set -ex

              apt-get update && apt-get install -y libffi-dev gcc g++ curl git wget build-essential

              git clone https://github.com/ArjunS07/s25-fermilab-research /tmp/repo
              cp -r /tmp/repo/src /mnt/data/

              if [ -d "/mnt/data/python-env" ] && /mnt/data/python-env/bin/python -c "import torch; print('Environment OK')" 2>/dev/null; then
                echo "=== Existing environment is working, skipping setup ==="
                source /mnt/data/python-env/bin/activate
              else
                rm -rf /mnt/data/python-env
                python -m venv /mnt/data/python-env
                source /mnt/data/python-env/bin/activate
                pip install torch --index-url https://download.pytorch.org/whl/cu121
                if [ -f /mnt/data/src/requirements.txt ]; then
                  pip install -r /mnt/data/src/requirements.txt
                else
                  echo "No requirements.txt found, skipping pip install"
                fi
              fi

              # --- FPND metric dependencies (torch_geometric + compiled PyG extensions) ---
              # Installed idempotently here (outside the cached-env branch above), since pods
              # reuse /mnt/data/python-env and skip the setup else-block. Wheel index matches
              # the installed torch (2.7.1, CUDA 12.6 from PyPI). Non-fatal: FPND is optional,
              # so a wheel-install failure must not kill the run.
              pip install torch_geometric \
                || echo "WARN: torch_geometric install failed; FPND will be skipped"
              pip install torch_scatter torch_sparse torch_cluster \
                -f https://data.pyg.org/whl/torch-2.7.1+cu126.html \
                || echo "WARN: PyG compiled extensions install failed; FPND will be skipped"

              echo "=== Environment setup complete ==="

              cd /mnt/data/src

              TRAIN_OUTPUT_PATH="/mnt/data/output/2026-03-27_10-06-27--bc5696dc-6139-4b66-9916-102fbc6c13ec-a30-polar-icp-hyperbolic"
              CHECKPOINT_PATH="${TRAIN_OUTPUT_PATH}/train/models/final_model.pth"

              UNIQUE_RUN_ID="$(date +%F_%H-%M-%S)--$POD_UID"
              BASE_OUT="/mnt/data/output/$UNIQUE_RUN_ID-a30-icp-hyperbolic-compare-infer"
              mkdir -p $BASE_OUT

              COMMON_ARGS="
                --config configs/infer-30-icp-hyperbolic-compare.yaml
                --set paths.checkpoint_path=${CHECKPOINT_PATH}
                --set paths.output_path=${TRAIN_OUTPUT_PATH}
              "

              echo "=== Run 1: Euclidean sampling ===" | tee -a ${BASE_OUT}/logs.txt
              python3 infer.py \
                $COMMON_ARGS \
                --set model.use_hyperbolic=false \
                --set paths.out_dir=${BASE_OUT}/euclidean \
                | tee -a ${BASE_OUT}/logs.txt

              echo "=== Run 2: Hyperbolic (Riemannian) sampling ===" | tee -a ${BASE_OUT}/logs.txt
              python3 infer.py \
                $COMMON_ARGS \
                --set model.use_hyperbolic=true \
                --set paths.out_dir=${BASE_OUT}/hyperbolic \
                | tee -a ${BASE_OUT}/logs.txt

          volumeMounts:
            - mountPath: /mnt/data
              name: as-train-pvc
          resources:
            limits:
              nvidia.com/a40: 1
              memory: "48Gi"
              cpu: "2.4"
            requests:
              nvidia.com/a40: 1
              memory: "36Gi"
              cpu: "2"
