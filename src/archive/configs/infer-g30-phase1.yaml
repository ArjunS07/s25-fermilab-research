# Eval config for the Phase-1 ablation grid re-evaluation.
# Architecture, prior_dist, and paths are set per-run via --set overrides.
data:
  jet_types: [g]
  num_particles: 30

inference:
  n_samples: 50000
  integration_steps: 64
  batch_size: 256
  cfg_guidance_weight: 2.0
  sampler: euler
  vf_mode: none
