# Documents every TrainRunConfig default (equal to today's argparse defaults).
# Not meant to be used as-is for a real run — start from one of the other
# configs/*.yaml files and override with --set as needed.

data:
  jet_types: ["g", "q", "t"]
  num_particles: 150

model:
  n_hidden: 128
  n_layers: 3
  use_residual: false
  use_reference_vectors: false
  use_node_scalars: false
  use_adaln: false
  use_hyperbolic: false

training:
  n_train_samples: 1000000
  batch_size: 16
  target_batch_size: 256
  cfg_null_dropout_rate: 0.2
  num_epochs: 100
  epoch_frac: 1.0
  sigma_min: 0.0001
  train_space: cartesian
  time_sampling: power_law
  lr: 0.0006
  weight_decay: 0.000001
  use_cosine_lr: true
  lr_t0: 0
  lr_warmup_epochs: 10
  eta_min_factor: 0.3
  use_curriculum: true
  use_time_sampling: true
  curriculum_alpha_start: 2.0
  n_curriculum_buckets: 10
  use_ema: false
  ema_decay: 0.999
  prior_dist: isotropic_com
  distributed: false

inference:
  n_samples: 50000
  n_viz_samples: 1000
  integration_steps: 16
  cfg_guidance_weight: 2.0
  batch_size: 256
  sampler: euler
  vf_mode: both
  skip_samples: false
  skip_metrics: false

paths:
  output_path: /mnt/data/output
  resume_weights: null
  checkpoint_path: null
  out_dir: null
  icp_cache_path: null
  cache_dir: /mnt/data/caches
