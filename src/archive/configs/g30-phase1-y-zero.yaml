# Wave 1' Y-zero: node scalars with zero seed + isotropic prior, no refs.
# Like F but with the m² physics seed removed. Predicted broken (no symmetry-break
# mechanism); spacelike fraction should drop from F's 80.7% if the exploit was in
# the m² seed.
data:
  jet_types: ["g"]
  num_particles: 30

model:
  use_residual: true
  use_node_scalars: true
  node_scalar_seed: zero

training:
  train_space: polar
  time_sampling: power_law
  batch_size: 50
  num_epochs: 200
  use_cosine_lr: true
  use_time_sampling: true
  use_curriculum: false
  prior_dist: isotropic_com

inference:
  n_samples: 50000
  integration_steps: 64
